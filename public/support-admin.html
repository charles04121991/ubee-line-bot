<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UBee｜客服管理中心 V5</title>
<style>
:root{
  --bg:#f5f6f7;
  --surface:#ffffff;
  --surface-soft:#fafafa;
  --ink:#151515;
  --muted:#6f7378;
  --border:#e5e7eb;
  --border-strong:#d5d8dc;
  --yellow:#facc15;
  --yellow-dark:#8a6700;
  --yellow-soft:#fff9d8;
  --blue:#2563eb;
  --blue-soft:#eef4ff;
  --green:#15803d;
  --green-soft:#edf9f1;
  --orange:#b45309;
  --orange-soft:#fff5e8;
  --red:#c62828;
  --red-soft:#fff1f2;
  --purple:#6d3fc0;
  --purple-soft:#f5f0ff;
  --shadow:0 8px 24px rgba(17,24,39,.055);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(250,204,21,.35);outline-offset:2px}
.hidden{display:none!important}
.app{width:min(100%,1440px);margin:0 auto;padding:20px}

/* Login */
.login-wrap{min-height:calc(100vh - 40px);display:grid;place-items:center}
.login{width:min(430px,100%);padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:0 18px 48px rgba(17,24,39,.08)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-logo,.brand-logo{display:grid;place-items:center;background:var(--yellow);color:#111;font-weight:1000;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.login-logo{width:52px;height:52px;border-radius:17px;font-size:26px}
.login h1{margin:0;font-size:25px;letter-spacing:-.5px}
.login p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
.field{margin-top:16px}
label{display:block;margin-bottom:7px;font-size:13px;font-weight:900}
.input,.textarea,.select,.search{width:100%;border:1px solid var(--border-strong);border-radius:13px;background:#fff;color:var(--ink);padding:12px 13px;outline:0;transition:border-color .15s,box-shadow .15s}
.input:focus,.textarea:focus,.select:focus,.search:focus{border-color:#b59000;box-shadow:0 0 0 4px rgba(250,204,21,.14)}
.textarea{min-height:116px;resize:vertical;line-height:1.65}
.hint{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.55}
.remember{display:flex;align-items:center;gap:8px;margin-top:13px;color:#5e6268;font-size:12px;font-weight:800}
.remember input{width:16px;height:16px;accent-color:#111}

/* Shared buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:11px;background:#fff;color:#222;font-size:12px;font-weight:900;line-height:1.2;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:#f7f7f7;border-color:#c8ccd0}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#171717;color:#fff;border-color:#171717}
.btn.primary:hover{background:#000}
.btn.yellow{background:var(--yellow);color:#111;border-color:#e9ba00}
.btn.yellow:hover{background:#f4c400}
.btn.blue{background:var(--blue-soft);color:#1d4ed8;border-color:#d7e4ff}
.btn.green{background:var(--green-soft);color:#166534;border-color:#cdebd8}
.btn.red{background:var(--red-soft);color:#a61f26;border-color:#ffd2d5}
.btn.purple{background:var(--purple-soft);color:#6036ad;border-color:#e3d6ff}
.btn.ghost{background:transparent;border-color:transparent;color:#62666c}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* Header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:16px;padding:15px 17px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}
.brand-wrap{display:flex;align-items:center;gap:12px;min-width:0}
.brand-logo{width:46px;height:46px;border-radius:15px;font-size:23px;flex:0 0 auto}
.brand{font-size:23px;font-weight:1000;letter-spacing:-.55px;line-height:1.15}
.brand span{color:#c09100}
.sub{margin-top:4px;color:var(--muted);font-size:11px;font-weight:750;line-height:1.45}
.actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.sync-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--border);border-radius:999px;background:#fafafa;color:#666b70;font-size:10px;font-weight:850;white-space:nowrap}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#18a558;box-shadow:0 0 0 3px rgba(24,165,88,.12)}
.sync-pill.offline .sync-dot{background:var(--red);box-shadow:0 0 0 3px rgba(198,40,40,.12)}

/* Metrics */
.brief{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.brief-card{position:relative;min-width:0;padding:14px 15px;border:1px solid var(--border);border-radius:16px;background:var(--surface);text-align:left;box-shadow:var(--shadow);transition:border-color .15s,transform .15s,box-shadow .15s}
.brief-card:hover{transform:translateY(-1px);border-color:#d2d5d9;box-shadow:0 10px 28px rgba(17,24,39,.075)}
.brief-card.active{border-color:#d0a300;box-shadow:0 0 0 2px rgba(250,204,21,.22)}
.brief-card span{display:block;color:#646970;font-size:11px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief-card b{display:block;margin-top:7px;font-size:27px;line-height:1;font-weight:1000}
.brief-card small{display:block;margin-top:7px;color:#92969b;font-size:9px;font-weight:750;line-height:1.35}
.brief-card.urgent b{color:var(--red)}
.brief-card.unassigned b{color:var(--orange)}
.brief-card.refund b{color:var(--purple)}
.brief-card.trash b{color:#8e242a}

/* Workspace */
.workspace{display:grid;grid-template-columns:410px minmax(0,1fr);gap:14px;align-items:start}
.panel{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.list-panel{display:flex;flex-direction:column;min-height:640px;max-height:calc(100vh - 220px)}
.detail-panel{min-height:640px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid var(--border)}
.panel-title{font-size:17px;font-weight:1000;letter-spacing:-.2px}
.panel-sub{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45}
.panel-body{display:flex;flex-direction:column;min-height:0;padding:14px 14px 0}

.filters{display:flex;gap:6px;overflow-x:auto;padding:0 0 3px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;padding:8px 10px;border:1px solid var(--border);border-radius:999px;background:#fff;color:#61656b;font-size:11px;font-weight:900;white-space:nowrap}
.filter:hover{background:#f7f7f7}
.filter.active{background:#171717;color:#fff;border-color:#171717}
.filter.priority.active{background:#8a3d0c;border-color:#8a3d0c}
.filter.trash.active{background:#a61f26;border-color:#a61f26}
.search{margin-top:10px;padding-left:13px}
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.select{font-size:11px;padding:10px 11px;background:#fbfbfb}
.result-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;margin:11px 2px 8px;color:#7a7f85;font-size:10px;font-weight:850}
.result-row .btn{min-height:28px}
.case-list{display:grid;gap:8px;min-height:0;overflow:auto;padding:0 2px 14px 0;overscroll-behavior:contain}
.case-list::-webkit-scrollbar{width:7px}
.case-list::-webkit-scrollbar-thumb{background:#d9dcdf;border-radius:999px}
.empty{padding:36px 12px;text-align:center;color:#94989e;font-size:12px;line-height:1.65}

/* Case list */
.case-card{position:relative;width:100%;padding:13px;border:1px solid var(--border);border-radius:15px;background:#fff;color:#191919;text-align:left;transition:border-color .15s,background .15s,box-shadow .15s}
.case-card:hover{border-color:#ccd0d4;background:#fdfdfd}
.case-card.active{border-color:#c99b00;box-shadow:0 0 0 2px rgba(250,204,21,.19);background:#fffdf4}
.case-card.overdue{border-left:4px solid var(--red);padding-left:11px}
.case-card.high:not(.overdue){border-left:4px solid var(--orange);padding-left:11px}
.case-card.deleted{border-style:dashed;background:#fffafa}
.case-card.deleted.active{border-style:solid;border-color:#b4232a;box-shadow:0 0 0 2px rgba(198,40,40,.12)}
.case-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.case-title{min-width:0;font-size:13px;font-weight:1000;line-height:1.4}
.status{flex:0 0 auto;padding:5px 8px;border-radius:999px;background:#f0f1f2;color:#5e6268;font-size:9px;font-weight:1000;white-space:nowrap}
.status.open{background:var(--yellow-soft);color:#795b00}
.status.progress{background:var(--blue-soft);color:#1f56bd}
.status.wait{background:var(--orange-soft);color:#9a4f00}
.status.done{background:var(--green-soft);color:#16613e}
.status.deleted{background:var(--red-soft);color:#a61f26}
.case-meta{margin-top:7px;color:#7d8288;font-size:10px;line-height:1.55;word-break:break-word}
.case-flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.flag{padding:4px 7px;border-radius:999px;background:#f2f3f4;color:#62666b;font-size:9px;font-weight:850}
.flag.high{background:var(--orange-soft);color:#994c00}
.flag.urgent{background:var(--red-soft);color:#a61f26}
.flag.refund{background:var(--purple-soft);color:#6036ad}
.flag.evidence{background:var(--green-soft);color:#16613e}
.flag.mine{background:var(--blue-soft);color:#1f56bd}
.flag.unassigned{background:var(--yellow-soft);color:#795b00}

/* Detail */
.detail-empty{display:grid;place-items:center;min-height:638px;padding:50px 18px;color:#969a9f;font-size:13px}
.detail-head{padding:18px 19px;background:linear-gradient(180deg,#fffdf0,#fff8cf);color:#171717;border-bottom:1px solid #eadc98}
.detail-head.deleted,.detail-head.urgent{background:linear-gradient(180deg,#fff7f7,#ffeded);border-bottom-color:#f2bfc3;color:#611b20}
.detail-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.detail-head small{display:block;color:#777c82;font-weight:850;letter-spacing:.1px}
.detail-head h2{margin:6px 0 5px;font-size:23px;line-height:1.28;letter-spacing:-.45px}
.detail-head p{margin:0;color:#676b70;font-size:12px;line-height:1.5}
.copy-group{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.copy-btn{padding:7px 9px;border:1px solid rgba(17,17,17,.14);border-radius:9px;background:rgba(255,255,255,.72);color:#333;font-size:10px;font-weight:850}
.copy-btn:hover{background:#fff}
.mobile-back{display:none;margin-bottom:11px;padding:8px 10px;border:1px solid rgba(17,17,17,.15);border-radius:10px;background:#fff;color:#222;font-size:11px;font-weight:900}
.detail-body{padding:16px 17px 22px}
.action-wrap{margin:-16px -17px 15px;padding:12px 17px;border-bottom:1px solid var(--border);background:#fff}
.action-grid{display:flex;gap:7px;flex-wrap:wrap}
.case-brief{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(230px,.75fr);gap:10px;margin-bottom:12px}
.case-brief-main,.case-brief-side{padding:14px;border:1px solid var(--border);border-radius:15px;background:var(--surface-soft)}
.case-brief-kicker{color:#83878c;font-size:10px;font-weight:900}
.case-brief-title{margin-top:5px;font-size:15px;font-weight:1000;line-height:1.45}
.case-brief-text{margin-top:6px;color:#666b70;font-size:11px;line-height:1.55}
.sla{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:5px}
.sla b{font-size:18px;line-height:1.2}
.sla span{color:#7b8086;font-size:10px}
.sla.urgent b{color:var(--red)}
.sla.watch b{color:var(--orange)}
.info-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.info{min-width:0;padding:11px;border:1px solid #eceeef;border-radius:13px;background:#fafafa}
.info span{display:block;color:#858a90;font-size:9px;font-weight:900}
.info b{display:block;margin-top:5px;font-size:12px;line-height:1.45;word-break:break-word}
.info a{color:#1d4ed8;text-decoration:none}
.section-title{display:flex;align-items:center;gap:8px;margin:19px 0 8px;font-size:14px;font-weight:1000}
.section-title:before{content:"";width:4px;height:15px;border-radius:999px;background:var(--yellow)}
.note{padding:13px 14px;border:1px solid #eceeef;border-radius:14px;background:#fafafa;color:#4f545a;font-size:12px;line-height:1.7;white-space:pre-line;word-break:break-word}
.note.warning{background:#fffaf0;border-color:#f2dfad;color:#6f5100}
.note.public{background:#fffdf0;border-color:#efe2a6}
.note.internal{background:#f4f5f6}
.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.order-item{padding:12px;border:1px solid var(--border);border-radius:13px;background:#fff}
.order-item span{color:#858a90;font-size:9px;font-weight:900}
.order-item b{display:block;margin-top:5px;font-size:12px;line-height:1.55;word-break:break-word}
.evidence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.evidence a,.evidence .file{display:block;padding:12px;border:1px solid var(--border);border-radius:13px;background:#fff;color:#1d4ed8;text-decoration:none;font-size:11px;font-weight:850;line-height:1.5;word-break:break-word}
.evidence a:hover{border-color:#9bb7f3;background:#f8fbff}
.evidence small{color:#82868b;font-weight:750}
.incident-list{display:grid;gap:7px}
.incident{padding:11px 12px;border:1px solid var(--border);border-radius:13px;background:#fafafa;color:#555a60;font-size:11px;line-height:1.55}
.incident b{color:#222;font-size:12px}
.timeline{display:grid}
.event{position:relative;display:grid;grid-template-columns:19px minmax(0,1fr);gap:10px;padding-bottom:15px}
.event:not(:last-child):before{content:"";position:absolute;left:8px;top:17px;bottom:0;width:2px;background:#e2e4e6}
.dot{z-index:1;width:18px;height:18px;border:5px solid #f0f1f2;border-radius:50%;background:#171717}
.event b{font-size:12px}
.event p{margin:3px 0;color:#62676c;font-size:11px;line-height:1.58;white-space:pre-line}
.event small{color:#92969b;font-size:9px}
.danger-zone{margin-top:12px;padding:13px;border:1px solid #f1c6ca;border-radius:14px;background:#fff6f7}
.danger-zone-title{margin-bottom:7px;color:#a61f26;font-size:12px;font-weight:1000}
.danger-zone-text{color:#805158;font-size:11px;line-height:1.6}

/* Modal & toast */
.modal-backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,15,15,.48);backdrop-filter:blur(3px)}
.modal-backdrop.show{display:flex}
.modal{width:min(570px,100%);max-height:90vh;overflow:auto;border:1px solid rgba(255,255,255,.2);border-radius:21px;background:#fff;box-shadow:0 26px 70px rgba(0,0,0,.24)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 17px;border-bottom:1px solid var(--border)}
.modal-head b{font-size:17px}
.modal-body{padding:17px}
.close{display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:#f1f2f3;color:#333;font-size:20px}
.confirm-box{padding:13px;border:1px solid #f0c3c7;border-radius:13px;background:#fff5f6;color:#90252b;font-size:12px;font-weight:800;line-height:1.65}
.confirm-case-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:1000}
.template-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.template-btn{padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:#fafafa;color:#555a60;font-size:10px;font-weight:850}
.template-btn:hover{background:var(--yellow-soft);border-color:#ead66c;color:#5d4700}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;display:none;max-width:min(360px,calc(100vw - 36px));padding:12px 15px;border-radius:12px;background:#171717;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.2);font-size:12px;font-weight:850}
.toast.show{display:block}

@media(max-width:1180px){
  .brief{grid-template-columns:repeat(3,minmax(0,1fr))}
  .workspace{grid-template-columns:370px minmax(0,1fr)}
  .info-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:920px){
  .app{padding:12px}
  .workspace{display:block}
  .list-panel,.detail-panel{min-height:0;max-height:none}
  .workspace.detail-open .list-panel{display:none}
  .workspace:not(.detail-open) .detail-panel{display:none}
  .workspace.detail-open .detail-panel{display:block}
  .mobile-back{display:inline-flex}
  .case-list{max-height:none;overflow:visible}
  .detail-empty{min-height:340px}
}
@media(max-width:700px){
  .app{padding:8px}
  .topbar{align-items:flex-start;flex-direction:column;padding:13px}
  .actions{width:100%;justify-content:flex-start}
  .actions .sync-pill{order:-1;width:100%;justify-content:center}
  .brief{grid-template-columns:1fr 1fr;gap:7px}
  .brief-card{padding:12px}
  .brief-card b{font-size:24px}
  .brief-card small{display:none}
  .workspace{gap:10px}
  .panel{border-radius:17px}
  .panel-body{padding:12px 12px 0}
  .tools-grid,.info-grid,.order-grid,.evidence,.case-brief{grid-template-columns:1fr}
  .result-row{grid-template-columns:1fr auto}
  .result-row .btn{grid-row:2;grid-column:1 / -1;justify-self:start}
  .detail-head-row{flex-direction:column}
  .copy-group{justify-content:flex-start}
  .detail-body{padding:14px 13px 20px}
  .action-wrap{margin:-14px -13px 14px;padding:11px 13px}
  .action-grid .btn{flex:1 1 calc(50% - 7px)}
  .brand{font-size:20px}
  .brand-logo{width:42px;height:42px;border-radius:14px}
}
@media(max-width:390px){
  .action-grid .btn{flex-basis:100%}
}
</style>
</head>

<body>
<div class="app">
  <div id="loginScreen" class="login-wrap">
    <div class="login">
      <div class="login-brand">
        <div class="login-logo">U</div>
        <div>
          <h1>UBee 客服管理中心</h1>
          <p>處理客服案件、客戶回覆、退款審核、結案與垃圾桶。</p>
        </div>
      </div>
      <div class="field">
        <label for="adminKey">客服管理密碼</label>
        <input id="adminKey" class="input" type="password" autocomplete="current-password" placeholder="輸入 Render 設定的管理密碼">
        <div class="hint">請填入 UBEE_SUPPORT_ADMIN_KEY 的實際 Value，不是環境變數名稱。</div>
      </div>
      <div class="field">
        <label for="operator">操作人員</label>
        <input id="operator" class="input" value="Charles" autocomplete="name" placeholder="例如：Charles">
        <div class="hint">此名稱會顯示在案件處理歷程中。</div>
      </div>
      <label class="remember"><input id="rememberKey" type="checkbox">只在這台私人裝置記住管理密碼</label>
      <button class="btn yellow" style="width:100%;margin-top:17px;min-height:46px" onclick="login()">登入客服管理中心</button>
    </div>
  </div>

  <div id="dashboard" class="hidden">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-logo">U</div>
        <div>
          <div class="brand">U<span>Bee</span> 客服管理中心</div>
          <div class="sub" id="operatorText"></div>
        </div>
      </div>
      <div class="actions">
        <span id="syncPill" class="sync-pill"><span class="sync-dot"></span><span id="syncText">尚未同步</span></span>
        <button class="btn" onclick="changeOperator()">更換人員</button>
        <span class="sync-pill"><span class="sync-dot"></span><span>密碼重設由 LINE Bot 自動處理</span></span>
        <button class="btn" onclick="loadCases(true)">重新整理</button>
        <button class="btn red" onclick="logout()">登出</button>
      </div>
    </header>

    <section class="brief" aria-label="客服案件摘要">
      <button class="brief-card urgent" data-brief="priority" onclick="setFilter('priority')"><span>需優先處理</span><b id="kpiPriority">0</b><small>高風險或等待超過24小時</small></button>
      <button class="brief-card unassigned" data-brief="unassigned" onclick="setFilter('unassigned')"><span>尚未指派</span><b id="kpiUnassigned">0</b><small>還沒有客服負責人</small></button>
      <button class="brief-card" data-brief="mine" onclick="setFilter('mine')"><span>我的案件</span><b id="kpiMine">0</b><small id="mineLabel">目前操作人員</small></button>
      <button class="brief-card refund" data-brief="refund" onclick="setFilter('refund')"><span>退款／財務</span><b id="kpiRefund">0</b><small>等待退款或財務確認</small></button>
      <button class="brief-card" data-brief="waiting" onclick="setFilter('waiting')"><span>等待回覆</span><b id="kpiWaiting">0</b><small>等待客戶或財務資料</small></button>
      <button class="brief-card trash" data-brief="trash" onclick="setFilter('trash')"><span>垃圾桶</span><b id="kpiTrash">0</b><small>可復原或永久刪除</small></button>
    </section>

    <main id="workspace" class="workspace">
      <section class="panel list-panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">案件列表</div>
            <div class="panel-sub">選擇案件後，在右側查看資料與處理。</div>
          </div>
          <label class="remember" style="margin:0"><input id="autoRefresh" type="checkbox" checked>自動更新</label>
        </div>
        <div class="panel-body">
          <div class="filters" aria-label="案件狀態篩選">
            <button class="filter active" data-filter="all" onclick="setFilter('all')">全部</button>
            <button class="filter priority" data-filter="priority" onclick="setFilter('priority')">需優先</button>
            <button class="filter" data-filter="open" onclick="setFilter('open')">待處理</button>
            <button class="filter" data-filter="progress" onclick="setFilter('progress')">處理中</button>
            <button class="filter" data-filter="waiting" onclick="setFilter('waiting')">等待回覆</button>
            <button class="filter" data-filter="done" onclick="setFilter('done')">已結案</button>
            <button class="filter trash" data-filter="trash" onclick="setFilter('trash')">垃圾桶</button>
          </div>
          <input id="search" class="search" placeholder="搜尋案件編號、訂單、姓名、電話或內容">
          <div class="tools-grid">
            <select id="sourceFilter" class="select"><option value="">全部來源</option><option value="customer">客戶</option><option value="merchant">店家</option><option value="rider">小U</option><option value="admin">內部</option></select>
            <select id="categoryFilter" class="select"><option value="">全部問題類型</option></select>
            <select id="assignmentFilter" class="select"><option value="">全部負責狀態</option><option value="unassigned">尚未指派</option><option value="mine">我的案件</option><option value="other">其他人負責</option></select>
            <select id="sortOrder" class="select"><option value="priority">智慧優先排序</option><option value="newest">最近更新</option><option value="oldest">最早建立</option><option value="severity">嚴重程度</option></select>
          </div>
          <div class="result-row"><span id="listModeText">全部案件</span><button class="btn ghost" onclick="clearFilters()">清除搜尋條件</button><span id="resultCount">0 筆案件</span></div>
          <div id="caseList" class="case-list"><div class="empty">讀取案件中…</div></div>
        </div>
      </section>

      <section id="detail" class="panel detail-panel"><div class="detail-empty">請先從案件列表選擇一筆案件。</div></section>
    </main>
  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head"><div><b id="modalTitle">案件操作</b><div class="panel-sub" id="modalSub"></div></div><button class="close" onclick="closeModal()" aria-label="關閉">×</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
'use strict';
const API_BASE=location.origin;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>'NT$'+Math.round(Number(v||0)).toLocaleString('zh-TW');
let cases=[];let selectedId='';let selectedDetail=null;let filter='all';let summary={};let autoTimer=null;let loading=false;

function fmtTime(ms){const n=Number(ms||0);return n?new Date(n).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'-'}
function statusLabel(s){return {OPEN:'待處理',IN_PROGRESS:'處理中',WAITING_USER:'等待客戶回覆',WAITING_FINANCE:'財務審核中',RESOLVED:'已結案',CLOSED:'已關閉',DELETED:'垃圾桶'}[s]||s||'-'}
function statusClass(s){return s==='OPEN'?'open':s==='IN_PROGRESS'?'progress':['WAITING_USER','WAITING_FINANCE'].includes(s)?'wait':s==='DELETED'?'deleted':'done'}
function roleLabel(v){return {customer:'客戶',merchant:'店家',rider:'小U',admin:'內部'}[v]||v||'-'}
function severityLabel(v){return {CRITICAL:'重大',HIGH:'高',MEDIUM:'一般',LOW:'低'}[v]||v||'-'}
function severityRank(v){return {CRITICAL:4,HIGH:3,MEDIUM:2,LOW:1}[v]||0}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3200)}
async function readJson(res){const data=await res.json().catch(()=>({}));if(!res.ok||data.success===false){const e=new Error(data.message||data.error||`HTTP ${res.status}`);e.status=res.status;throw e}return data}
function key(){return sessionStorage.getItem('ubee_support_admin_key')||localStorage.getItem('ubee_support_admin_key_saved')||''}
function operator(){return localStorage.getItem('ubee_support_operator')||'Charles'}
function headers(){return {'Content-Type':'application/json','X-UBee-Support-Admin-Key':key(),'X-UBee-Support-Operator':operator()}}
async function api(path,opt={}){return readJson(await fetch(API_BASE+path,{cache:'no-store',...opt,headers:{...headers(),...(opt.headers||{})}}))}
function ageHours(c){const base=Number(c.createdAtMs||c.updatedAtMs||0);return base?Math.max(0,(Date.now()-base)/3600000):0}
function ageText(c){const h=ageHours(c);if(h<1)return '1小時內';if(h<24)return `等待 ${Math.floor(h)} 小時`;return `等待 ${Math.floor(h/24)} 天`}
function isActive(c){return !c.isDeleted&&!['RESOLVED','CLOSED','DELETED'].includes(c.status)}
function isOverdue(c){return isActive(c)&&ageHours(c)>=24&&c.status!=='WAITING_USER'}
function isPriority(c){return isActive(c)&&(isOverdue(c)||['CRITICAL','HIGH'].includes(c.severity)||(!c.assignedTo&&c.status==='OPEN'))}
function priorityScore(c){let score=0;if(c.isDeleted)return -10000;if(c.severity==='CRITICAL')score+=1000;if(c.severity==='HIGH')score+=700;if(isOverdue(c))score+=500;if(c.status==='OPEN')score+=280;if(!c.assignedTo)score+=220;if(c.status==='WAITING_FINANCE'||c.refundRequestStatus)score+=160;score+=Math.min(160,ageHours(c));return score}
function hasRefund(c){return Boolean(c.refundRequestStatus||c.refundRequestId||c.status==='WAITING_FINANCE')}
function modalOpen(){return $('modalBackdrop').classList.contains('show')}
function userTyping(){const tag=document.activeElement?.tagName;return ['INPUT','TEXTAREA','SELECT'].includes(tag)}

async function login(){const k=$('adminKey').value.trim(),op=$('operator').value.trim()||'Charles';if(!k)return alert('請輸入客服管理密碼。');sessionStorage.setItem('ubee_support_admin_key',k);localStorage.setItem('ubee_support_operator',op);if($('rememberKey').checked)localStorage.setItem('ubee_support_admin_key_saved',k);else localStorage.removeItem('ubee_support_admin_key_saved');try{await api('/api/admin/support/cases?limit=1');showDashboard();await loadCases()}catch(err){sessionStorage.removeItem('ubee_support_admin_key');alert('登入失敗：'+err.message)}}
function logout(){sessionStorage.removeItem('ubee_support_admin_key');localStorage.removeItem('ubee_support_admin_key_saved');location.reload()}
function changeOperator(){const next=prompt('輸入新的操作人員名稱：',operator());if(!next?.trim())return;localStorage.setItem('ubee_support_operator',next.trim());showDashboard();updateKpis();renderCases();toast('操作人員已更新')}
function showDashboard(){$('loginScreen').classList.add('hidden');$('dashboard').classList.remove('hidden');$('operatorText').textContent=`目前操作人員：${operator()}｜管理案件、回覆、退款與結案`;$('mineLabel').textContent=operator()}
function listPath(){return filter==='trash'?'/api/admin/support/cases?limit=500&deleted=only':'/api/admin/support/cases?limit=500'}
function setNetworkState(){const offline=!navigator.onLine;$('syncPill')?.classList.toggle('offline',offline);if(offline)$('syncText').textContent='裝置離線'}

async function loadCases(showMessage=false){if(loading)return;loading=true;setNetworkState();try{const data=await api(listPath());cases=data.cases||[];summary=data.summary||{};fillCategories(data.categories||[]);updateKpis();renderCases();$('syncText').textContent='更新於 '+new Date().toLocaleTimeString('zh-TW',{hour12:false});if(selectedId&&cases.some(c=>c.caseId===selectedId))await loadDetail(selectedId,false);else if(selectedId){selectedId='';selectedDetail=null;showList();$('detail').innerHTML='<div class="detail-empty">請從左側選擇一筆案件。</div>'}if(showMessage)toast('客服案件已更新')}catch(err){if(err.status===401||/金鑰|不正確/.test(err.message))return logout();$('caseList').innerHTML=`<div class="empty">讀取失敗：${esc(err.message)}</div>`}finally{loading=false}}
function fillCategories(items){const select=$('categoryFilter');if(select.dataset.ready)return;items.forEach(item=>{const option=document.createElement('option');option.value=item.value;option.textContent=item.label;select.appendChild(option)});select.dataset.ready='1'}
function updateKpis(){const normal=cases.filter(c=>!c.isDeleted);$('kpiPriority').textContent=normal.filter(isPriority).length;$('kpiUnassigned').textContent=normal.filter(c=>isActive(c)&&!c.assignedTo).length;$('kpiMine').textContent=normal.filter(c=>isActive(c)&&c.assignedTo===operator()).length;$('kpiRefund').textContent=normal.filter(hasRefund).length;$('kpiWaiting').textContent=normal.filter(c=>['WAITING_USER','WAITING_FINANCE'].includes(c.status)).length;$('kpiTrash').textContent=Number(summary.deleted||cases.filter(c=>c.isDeleted).length);document.querySelectorAll('[data-brief]').forEach(x=>x.classList.toggle('active',x.dataset.brief===filter))}
function matchesFilter(c){if(filter==='priority')return isPriority(c);if(filter==='open')return c.status==='OPEN';if(filter==='progress')return c.status==='IN_PROGRESS';if(filter==='waiting')return ['WAITING_USER','WAITING_FINANCE'].includes(c.status);if(filter==='done')return ['RESOLVED','CLOSED'].includes(c.status);if(filter==='unassigned')return isActive(c)&&!c.assignedTo;if(filter==='mine')return isActive(c)&&c.assignedTo===operator();if(filter==='refund')return hasRefund(c);if(filter==='trash')return c.status==='DELETED'||c.isDeleted;return !c.isDeleted}
function getFilteredCases(){const q=$('search').value.trim().toLowerCase(),source=$('sourceFilter').value,category=$('categoryFilter').value,assign=$('assignmentFilter').value,sort=$('sortOrder').value;const list=cases.filter(matchesFilter).filter(c=>!source||c.sourceRole===source).filter(c=>!category||c.category===category).filter(c=>!assign||(assign==='unassigned'&&!c.assignedTo)||(assign==='mine'&&c.assignedTo===operator())||(assign==='other'&&c.assignedTo&&c.assignedTo!==operator())).filter(c=>!q||[c.caseId,c.orderId,c.orderNo,c.sourceName,c.contactPhone,c.title,c.description,c.assignedTo,c.deletedReason].some(v=>String(v||'').toLowerCase().includes(q)));list.sort((a,b)=>sort==='priority'?(priorityScore(b)-priorityScore(a)||b.updatedAtMs-a.updatedAtMs):sort==='oldest'?(a.createdAtMs-b.createdAtMs):sort==='severity'?(severityRank(b.severity)-severityRank(a.severity)||b.updatedAtMs-a.updatedAtMs):((b.isDeleted?b.deletedAtMs:b.updatedAtMs)-(a.isDeleted?a.deletedAtMs:a.updatedAtMs)));return list}
function listLabel(){return {priority:'需優先處理',all:'全部案件',open:'待處理案件',progress:'處理中案件',waiting:'等待回覆／財務',done:'已結案案件',unassigned:'尚未指派',mine:'我的案件',refund:'退款／財務案件',trash:'垃圾桶案件'}[filter]||'客服案件'}
function renderCases(){const list=getFilteredCases();$('resultCount').textContent=`${list.length} 筆案件`;$('listModeText').textContent=listLabel();document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));document.querySelectorAll('[data-brief]').forEach(x=>x.classList.toggle('active',x.dataset.brief===filter));$('caseList').innerHTML=list.length?list.map(c=>{const overdue=isOverdue(c),high=['HIGH','CRITICAL'].includes(c.severity);return `<button class="case-card ${c.caseId===selectedId?'active':''} ${c.isDeleted?'deleted':''} ${overdue?'overdue':''} ${high?'high':''}" onclick="loadDetail('${esc(c.caseId)}')"><div class="case-top"><div class="case-title">${esc(c.categoryLabel||c.title||'客服案件')}</div><span class="status ${statusClass(c.status)}">${esc(statusLabel(c.status))}</span></div><div class="case-meta">${esc(c.caseId)}${c.orderId?`・訂單 ${esc(c.orderId)}`:''}<br>${esc(c.sourceName||c.contactPhone||roleLabel(c.sourceRole))}・${esc(fmtTime(c.isDeleted?c.deletedAtMs:c.updatedAtMs))}</div><div class="case-flags">${overdue?`<span class="flag urgent">${esc(ageText(c))}</span>`:`<span class="flag">${esc(ageText(c))}</span>`}<span class="flag ${high?'high':''}">${esc(severityLabel(c.severity))}</span>${Number(c.evidenceCount||0)>0?`<span class="flag evidence">證據 ${Number(c.evidenceCount)}</span>`:''}${hasRefund(c)?'<span class="flag refund">退款／財務</span>':''}${c.assignedTo?`<span class="flag ${c.assignedTo===operator()?'mine':''}">${esc(c.assignedTo)}</span>`:'<span class="flag unassigned">未指派</span>'}</div></button>`}).join(''):'<div class="empty">目前沒有符合條件的案件。</div>'}
async function setFilter(next){const needReload=(filter==='trash')!==(next==='trash');filter=next;selectedId='';selectedDetail=null;showList();$('detail').innerHTML='<div class="detail-empty">請從左側選擇一筆案件。</div>';if(needReload)await loadCases();else{updateKpis();renderCases()}}
function clearFilters(){$('search').value='';$('sourceFilter').value='';$('categoryFilter').value='';$('assignmentFilter').value='';$('sortOrder').value='priority';renderCases()}
function showDetail(){$('workspace').classList.add('detail-open')}function showList(){$('workspace').classList.remove('detail-open')}

async function loadDetail(id,rerenderList=true){selectedId=id;if(rerenderList)renderCases();showDetail();$('detail').innerHTML='<div class="detail-empty">讀取案件中…</div>';try{selectedDetail=await api(`/api/admin/support/cases/${encodeURIComponent(id)}?t=${Date.now()}`);renderDetail()}catch(err){$('detail').innerHTML=`<div class="detail-empty">${esc(err.message)}</div>`}}
function renderDetail(){const d=selectedDetail,c=d.case||{},events=d.events||[],evidence=d.evidence||[],finance=d.finance||{},incidents=d.incidents||[],o=d.liveOrder||d.orderSnapshot||{};const deleted=Boolean(c.isDeleted||c.status==='DELETED'),done=['RESOLVED','CLOSED'].includes(c.status),overdue=isOverdue(c);const pickup=o.addresses?.pickup||o.pickupAddress||o.pickup||'-',dropoff=o.addresses?.dropoff||o.dropoffAddress||o.dropoff||'-';const rider=o.people?.riderName||o.riderName||'-',item=o.itemName||o.item||o.serviceType||'-';let actions='';if(deleted){actions=`<button class="btn green" onclick="restoreCase()">復原案件</button><button class="btn red" onclick="openPermanentDelete()" ${c.refundRequestId||c.refundRequestStatus?'disabled title="有退款／財務紀錄，不能永久刪除"':''}>永久刪除</button>`}else if(!done){actions=`${c.assignedTo!==operator()?`<button class="btn yellow" onclick="assignSelf()">指派給我</button>`:''}<button class="btn primary" onclick="startCase()">開始處理</button><button class="btn blue" onclick="openTextAction('PUBLIC_REPLY','回覆客戶','輸入客戶看得到的回覆')">回覆客戶</button><button class="btn" onclick="openTextAction('WAIT_USER','等待客戶回覆','請說明需要補充什麼資料')">等待回覆</button><button class="btn" onclick="openTextAction('INTERNAL_NOTE','內部備註','只有 UBee 內部看得到')">內部備註</button>${c.orderId?`<button class="btn yellow" onclick="openRefund()">申請退款審核</button>`:''}<button class="btn green" onclick="openTextAction('RESOLVE','結案','請填寫完整處理結果')">結案</button><button class="btn red" onclick="openTrash()">刪除案件</button>`}else{actions=`<button class="btn yellow" onclick="openTextAction('REOPEN','重新開啟','請說明重新開啟原因')">重新開啟</button><button class="btn red" onclick="openTrash()">刪除案件</button>`}const reason=overdue?'案件已超過24小時，建議優先確認。':['CRITICAL','HIGH'].includes(c.severity)?'案件被標記為高風險，建議優先處理。':!c.assignedTo&&isActive(c)?'案件尚未指派負責人。':'案件目前依一般順序處理。';$('detail').innerHTML=`<div class="detail-head ${deleted?'deleted':''} ${overdue?'urgent':''}"><button class="mobile-back" onclick="showList()">← 返回案件列表</button><div class="detail-head-row"><div><small>${esc(c.caseId||'')}</small><h2>${esc(c.categoryLabel||c.title||'客服案件')}</h2><p>${esc(statusLabel(c.status))}${c.orderId?`・訂單 ${esc(c.orderId)}`:''}</p></div><div class="copy-group"><button class="copy-btn" onclick="copyText('${esc(c.caseId||'')}','案件編號')">複製案件編號</button>${c.orderId?`<button class="copy-btn" onclick="copyText('${esc(c.orderId)}','訂單編號')">複製訂單編號</button>`:''}${c.contactPhone?`<button class="copy-btn" onclick="copyText('${esc(c.contactPhone)}','電話')">複製電話</button>`:''}</div></div></div><div class="detail-body"><div class="action-wrap"><div class="action-grid">${actions}</div></div><div class="case-brief"><div class="case-brief-main"><div class="case-brief-kicker">目前判斷</div><div class="case-brief-title">${esc(reason)}</div><div class="case-brief-text">來源：${esc(roleLabel(c.sourceRole))}・負責人：${esc(c.assignedTo||'尚未指派')}・嚴重程度：${esc(severityLabel(c.severity))}</div></div><div class="case-brief-side"><div class="case-brief-kicker">案件等待時間</div><div class="sla ${overdue?'urgent':ageHours(c)>=12?'watch':''}"><b>${esc(ageText(c))}</b><span>${esc(fmtTime(c.createdAtMs))}</span></div><div class="case-brief-text">最後更新：${esc(fmtTime(c.updatedAtMs))}</div></div></div>${deleted?`<div class="danger-zone"><div class="danger-zone-title">此案件目前在垃圾桶</div><div class="danger-zone-text">刪除原因：${esc(c.deletedReason||'-')}<br>刪除人員：${esc(c.deletedBy||'-')}・${esc(fmtTime(c.deletedAtMs))}<br>復原後會回到刪除前的案件狀態。</div></div>`:''}<div class="info-grid"><div class="info"><span>案件來源</span><b>${esc(roleLabel(c.sourceRole))}・${esc(c.sourceName||'-')}</b></div><div class="info"><span>聯絡電話</span><b>${c.contactPhone?`<a href="tel:${esc(c.contactPhone)}">${esc(c.contactPhone)}</a>`:'-'}</b></div><div class="info"><span>負責人</span><b>${esc(c.assignedTo||'尚未指派')}</b></div><div class="info"><span>嚴重程度</span><b>${esc(severityLabel(c.severity))}</b></div><div class="info"><span>建立時間</span><b>${esc(fmtTime(c.createdAtMs))}</b></div><div class="info"><span>最後更新</span><b>${esc(fmtTime(c.updatedAtMs))}</b></div><div class="info"><span>退款狀態</span><b>${esc(c.refundRequestStatus||'未申請')}${c.refundRequestedAmount?`・${money(c.refundRequestedAmount)}`:''}</b></div><div class="info"><span>客戶實收</span><b>${money(finance.actualPaidAmount||finance.finalCustomerTotal)}</b></div></div><div class="section-title">問題說明</div><div class="note">${esc(c.description||'')}</div>${c.requestedResolution?`<div class="section-title">希望處理方式</div><div class="note warning">${esc(c.requestedResolution)}</div>`:''}${c.latestPublicReply?`<div class="section-title">最近對外回覆</div><div class="note public">${esc(c.latestPublicReply)}</div>`:''}${c.latestInternalNote?`<div class="section-title">最近內部備註</div><div class="note internal">${esc(c.latestInternalNote)}</div>`:''}<div class="section-title">關聯訂單資料</div><div class="order-grid"><div class="order-item"><span>取件地址</span><b>${esc(pickup)}</b></div><div class="order-item"><span>送達地址</span><b>${esc(dropoff)}</b></div><div class="order-item"><span>配送內容</span><b>${esc(item)}</b></div><div class="order-item"><span>小U</span><b>${esc(rider)}</b></div></div><div class="section-title">任務證據</div><div class="evidence">${evidence.length?evidence.map(e=>e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.evidenceTypeLabel||'證據')}<br>${esc(e.originalName||'開啟檔案')}<br><small>${esc(fmtTime(e.uploadedAtMs))}</small></a>`:`<div class="file">${esc(e.originalName||'證據檔案')}</div>`).join(''):'<div class="note">目前沒有上傳證據。</div>'}</div>${incidents.length?`<div class="section-title">調度異常紀錄</div><div class="incident-list">${incidents.map(i=>`<div class="incident"><b>${esc(i.typeLabel||i.type||'異常')}</b><br>${esc(i.description||'')}<br><small>${esc(i.status||'-')}・${esc(fmtTime(i.updatedAtMs||i.createdAtMs))}</small></div>`).join('')}</div>`:''}<div class="section-title">處理時間軸</div><div class="timeline">${events.length?events.map(e=>`<div class="event"><div class="dot"></div><div><b>${esc(e.title||e.type)}</b><p>${esc(e.message||'')}</p><small>${esc(fmtTime(e.createdAtMs))}・${esc(e.operator||'UBee')}</small></div></div>`).join(''):'<div class="empty">目前沒有處理紀錄。</div>'}</div></div>`}
async function copyText(value,label){try{await navigator.clipboard.writeText(value);toast(`${label}已複製`)}catch(e){prompt(`請複製${label}`,value)}}
async function postAction(type,payload={}){return api(`/api/admin/support/cases/${encodeURIComponent(selectedId)}/action`,{method:'POST',body:JSON.stringify({action:type,operator:operator(),...payload})})}
async function action(type,payload={}){try{await postAction(type,payload);closeModal();toast('案件已更新');await loadCases()}catch(err){alert(err.message)}}
async function assignSelf(){try{await postAction('ASSIGN',{assignedTo:operator()});toast('案件已指派給你');await loadCases()}catch(err){alert(err.message)}}
async function startCase(){try{const c=selectedDetail?.case||{};if(!c.assignedTo||c.assignedTo!==operator())await postAction('ASSIGN',{assignedTo:operator()});await postAction('START',{message:'UBee 客服已開始處理此案件。'});toast('已開始處理案件');await loadCases()}catch(err){alert(err.message)}}
const replyTemplates={PUBLIC_REPLY:[['已收到','您好，我們已收到您的回報，UBee 客服正在確認訂單與配送紀錄，後續結果會更新在此案件中。'],['需要補充','為了協助確認，請補充相關照片、收據或更完整的事件經過，收到後我們會繼續處理。'],['已完成確認','您好，這筆案件已完成確認，處理結果如下：']],WAIT_USER:[['補照片','請補充商品、包裝或現場照片，以利客服確認。'],['補收據','請補充購買收據或付款證明，以利核對金額。'],['補時間地點','請補充事件發生時間與地點，以利查詢配送紀錄。']],INTERNAL_NOTE:[['已聯絡','已嘗試聯絡當事人，等待回覆。'],['已查訂單','已核對訂單狀態與配送時間。'],['待主管判斷','案件情況需要主管進一步判斷。']]};
function openTextAction(type,title,placeholder){const templates=replyTemplates[type]||[];openModal(title,'',`${templates.length?`<div class="template-row">${templates.map((x,i)=>`<button class="template-btn" onclick="useTemplate('${esc(type)}',${i})">${esc(x[0])}</button>`).join('')}</div>`:''}<textarea id="modalText" class="textarea" placeholder="${esc(placeholder)}"></textarea><button class="btn primary" style="width:100%;margin-top:12px" onclick="submitTextAction('${esc(type)}')">確認送出</button>`)}
function useTemplate(type,index){const text=replyTemplates[type]?.[index]?.[1]||'';const el=$('modalText');el.value=el.value?`${el.value}\n${text}`:text;el.focus()}
async function submitTextAction(type){const message=$('modalText').value.trim();if(!message)return alert('請填寫內容。');await action(type,{message})}
function openRefund(){const f=selectedDetail?.finance||{};openModal('送交財務退款審核','這不會直接退款。',`<div class="field"><label>退款申請金額</label><input id="refundAmount" class="input" type="number" min="1" value="${Number(f.actualPaidAmount||f.finalCustomerTotal||0)}"></div><div class="field"><label>退款原因</label><textarea id="refundReason" class="textarea" placeholder="請說明退款原因與判斷依據"></textarea></div><button class="btn yellow" style="width:100%;margin-top:12px" onclick="submitRefund()">送交財務審核</button>`)}
async function submitRefund(){const amount=Number($('refundAmount').value||0),reason=$('refundReason').value.trim();if(amount<=0||!reason)return alert('請填寫退款金額與原因。');try{await api(`/api/admin/support/cases/${encodeURIComponent(selectedId)}/refund-request`,{method:'POST',body:JSON.stringify({amount,reason,operator:operator()})});closeModal();toast('已送交財務審核');await loadCases()}catch(err){alert(err.message)}}
function openTrash(){const c=selectedDetail?.case||{};openModal('刪除客服案件','案件會先移到垃圾桶，可再復原。',`<div class="confirm-box">你正在刪除案件 <span class="confirm-case-id">${esc(c.caseId||'')}</span>。這不會立刻永久清除資料。</div><div class="field"><label>刪除原因 *</label><textarea id="deleteReason" class="textarea" placeholder="例如：重複建立、測試案件、誤建案件"></textarea></div><button class="btn red" style="width:100%;margin-top:12px;padding:13px" onclick="submitTrash()">確認移到垃圾桶</button>`)}
async function submitTrash(){const reason=$('deleteReason').value.trim();if(!reason)return alert('請填寫刪除原因。');if(!confirm('確定要把這筆案件移到垃圾桶嗎？'))return;try{await api(`/api/admin/support/cases/${encodeURIComponent(selectedId)}/trash`,{method:'POST',body:JSON.stringify({reason,operator:operator()})});closeModal();toast('案件已移到垃圾桶');filter='trash';selectedId='';selectedDetail=null;await loadCases()}catch(err){alert(err.message)}}
async function restoreCase(){if(!confirm('確定要復原這筆客服案件嗎？'))return;try{await api(`/api/admin/support/cases/${encodeURIComponent(selectedId)}/restore`,{method:'POST',body:JSON.stringify({operator:operator(),message:'案件由客服營運工作台復原。'})});toast('案件已復原');filter='all';selectedId='';selectedDetail=null;showList();await loadCases()}catch(err){alert(err.message)}}
function openPermanentDelete(){const c=selectedDetail?.case||{};if(c.refundRequestId||c.refundRequestStatus)return alert('此案件已有退款／財務紀錄，不能永久刪除，只能留在垃圾桶。');openModal('永久刪除案件','此動作無法復原。',`<div class="confirm-box"><b>警告：</b>永久刪除會移除案件、處理時間軸、證據資料與 Firebase Storage 檔案，無法復原。<br><br>請完整輸入案件編號：<br><span class="confirm-case-id">${esc(c.caseId||'')}</span></div><div class="field"><label>輸入案件編號確認</label><input id="confirmDeleteId" class="input" autocomplete="off" placeholder="${esc(c.caseId||'')}"></div><button class="btn red" style="width:100%;margin-top:12px;padding:13px" onclick="submitPermanentDelete()">永久刪除，無法復原</button>`)}
async function submitPermanentDelete(){const confirmCaseId=$('confirmDeleteId').value.trim().toUpperCase();if(confirmCaseId!==selectedId.toUpperCase())return alert('案件編號不一致，已取消永久刪除。');if(!confirm('最後確認：永久刪除後完全無法復原，確定繼續嗎？'))return;try{const data=await api(`/api/admin/support/cases/${encodeURIComponent(selectedId)}`,{method:'DELETE',body:JSON.stringify({confirmCaseId,operator:operator()})});closeModal();toast(data.message||'案件已永久刪除');selectedId='';selectedDetail=null;showList();await loadCases()}catch(err){alert(err.message)}}
function normalizeResetPhone(v){return String(v||'').replace(/\D/g,'').slice(0,10)}
/* Password Reset V3：客服人工查詢／產生／複製連結功能已移除；LINE Bot 全自動處理。 */

function openModal(title,sub,body){$('modalTitle').textContent=title;$('modalSub').textContent=sub||'';$('modalBody').innerHTML=body;$('modalBackdrop').classList.add('show')}
function closeModal(){$('modalBackdrop').classList.remove('show')}
function setupAutoRefresh(){clearInterval(autoTimer);autoTimer=setInterval(()=>{if($('autoRefresh')?.checked&&document.visibilityState==='visible'&&!modalOpen()&&!userTyping())loadCases(false)},30000)}
['search','sourceFilter','categoryFilter','assignmentFilter','sortOrder'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',renderCases));
$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('autoRefresh')?.checked&&!modalOpen())loadCases(false)});window.addEventListener('online',()=>{setNetworkState();loadCases(false)});window.addEventListener('offline',setNetworkState);
(function init(){const saved=localStorage.getItem('ubee_support_admin_key_saved');$('operator').value=operator();setupAutoRefresh();setNetworkState();if(saved){$('adminKey').value=saved;$('rememberKey').checked=true;sessionStorage.setItem('ubee_support_admin_key',saved);showDashboard();loadCases()}else if(sessionStorage.getItem('ubee_support_admin_key')){showDashboard();loadCases()}})();
</script>
</body>
</html>
