<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UBee｜客服管理中心</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111;--muted:#73777d;--line:#e5e7ea;--yellow:#facc15;--blue:#2768d7;--green:#16834f;--red:#d93b42;--orange:#df8500;--shadow:0 10px 30px rgba(17,24,39,.06)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1480px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:27px;font-weight:1000}.brand span{color:#e4ad00}.sub{font-size:12px;color:var(--muted);font-weight:800;margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:#111;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:1000}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.yellow{background:var(--yellow);border-color:var(--yellow)}.btn.blue{background:#edf3ff;color:#2459b4;border-color:#d8e5ff}.btn.green{background:#e9f8ef;color:#156a42;border-color:#ccebd9}.btn.red{background:#fff0f1;color:#b92830;border-color:#ffd3d6}.btn:disabled{opacity:.45}.login-wrap{min-height:72vh;display:flex;align-items:center;justify-content:center}.login{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.login h1{font-size:26px;margin:0}.login p{color:var(--muted);line-height:1.65;font-size:13px}.field{margin-top:13px}label{display:block;font-size:13px;font-weight:1000;margin-bottom:7px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:#fafafa;outline:0}.textarea{min-height:110px;resize:vertical;line-height:1.65}.hint{font-size:11px;color:#777;line-height:1.6;margin-top:7px}.remember{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12px;font-weight:900;color:#666}.hidden{display:none!important}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.kpi span{display:block;color:var(--muted);font-size:11px;font-weight:900}.kpi b{display:block;margin-top:5px;font-size:29px}.workspace{display:grid;grid-template-columns:minmax(350px,.8fr) minmax(540px,1.2fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.panel-title{font-size:17px;font-weight:1000}.panel-sub{font-size:11px;color:var(--muted);margin-top:3px}.panel-body{padding:14px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:1000;color:#666}.filter.active{background:#111;color:#fff;border-color:#111}.search{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:13px;padding:11px 12px;outline:0}.case-list{display:grid;gap:8px;max-height:calc(100vh - 270px);overflow:auto}.case-card{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff;text-align:left}.case-card.active{border:2px solid var(--yellow);padding:11px;background:#fffdf2}.case-top{display:flex;justify-content:space-between;gap:10px}.case-title{font-size:13px;font-weight:1000;line-height:1.4}.status{flex:0 0 auto;padding:5px 7px;border-radius:999px;background:#f1f2f4;color:#666;font-size:9px;font-weight:1000}.status.open{background:#fff4d6;color:#936100}.status.progress{background:#eaf1ff;color:#2459b4}.status.wait{background:#fff0df;color:#a35b00}.status.done{background:#eaf8ef;color:#16613e}.case-meta{font-size:10px;color:#888;line-height:1.55;margin-top:6px}.detail-empty{text-align:center;padding:60px 15px;color:#999}.detail-head{padding:17px;background:#111;color:#fff}.detail-head small{color:#bbb;font-weight:800}.detail-head h2{font-size:23px;margin:6px 0}.detail-head p{margin:0;color:#ddd;font-size:12px}.detail-body{padding:15px}.action-grid{display:flex;gap:7px;flex-wrap:wrap}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.info{padding:10px;border-radius:13px;background:#f7f8f9}.info span{display:block;color:#888;font-size:9px;font-weight:900}.info b{display:block;margin-top:4px;font-size:12px;word-break:break-word}.section-title{font-size:14px;font-weight:1000;margin:18px 0 8px}.note{padding:12px;border-radius:14px;background:#f7f8f9;font-size:12px;color:#555;line-height:1.65;white-space:pre-line}.evidence{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.evidence a{display:block;padding:10px;border:1px solid var(--line);border-radius:13px;color:#2459b4;text-decoration:none;font-size:11px;font-weight:900}.timeline{display:grid}.event{display:grid;grid-template-columns:18px 1fr;gap:9px;position:relative;padding-bottom:14px}.event:not(:last-child):before{content:"";position:absolute;left:7px;top:16px;bottom:0;width:2px;background:#e3e5e7}.dot{width:16px;height:16px;border-radius:50%;background:#111;border:4px solid #f1f2f4;z-index:1}.event b{font-size:12px}.event p{font-size:11px;color:#666;line-height:1.55;margin:3px 0;white-space:pre-line}.event small{font-size:9px;color:#999}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.show{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px}.modal-head{display:flex;justify-content:space-between;gap:10px;padding:16px;border-bottom:1px solid var(--line)}.modal-head b{font-size:18px}.modal-body{padding:16px}.close{width:34px;height:34px;border:0;border-radius:50%;font-size:20px}.empty{text-align:center;color:#999;padding:30px 10px}.toast{position:fixed;right:16px;bottom:16px;background:#111;color:#fff;padding:11px 14px;border-radius:13px;font-size:12px;font-weight:900;display:none;z-index:200}.toast.show{display:block}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.case-list{max-height:none}.info-grid{grid-template-columns:1fr 1fr}}@media(max-width:680px){.app{padding:10px}.topbar{align-items:flex-start}.kpis{grid-template-columns:1fr 1fr}.info-grid,.evidence{grid-template-columns:1fr}.brand{font-size:23px}}
</style>
</head>
<body>
<div class="app">
  <div id="loginScreen" class="login-wrap"><div class="login"><h1>UBee 客服管理中心</h1><p>這是 UBee 內部頁面。登入後可以處理案件、回覆客戶、建立退款審核與結案。</p><div class="field"><label>客服管理密碼</label><input id="adminKey" class="input" type="password" placeholder="填入 Render 的 UBEE_SUPPORT_ADMIN_KEY Value"><div class="hint">請填你在 Render 設定的實際密碼，不是填「UBEE_SUPPORT_ADMIN_KEY」這串名稱。</div></div><div class="field"><label>操作人員</label><input id="operator" class="input" value="Charles" placeholder="例如：Charles"><div class="hint">用來記錄是誰處理案件，不是另一組密碼。</div></div><label class="remember"><input id="rememberKey" type="checkbox">只在這台私人裝置記住管理密碼</label><button class="btn yellow" style="width:100%;margin-top:15px;padding:14px" onclick="login()">進入客服管理中心</button></div></div>

  <div id="dashboard" class="hidden">
    <header class="topbar"><div><div class="brand">U<span>Bee</span> 客服管理中心</div><div class="sub" id="operatorText"></div></div><div class="actions"><button class="btn" onclick="loadCases()">重新整理</button><button class="btn red" onclick="logout()">登出</button></div></header>
    <section class="kpis"><div class="kpi"><span>待處理</span><b id="kpiOpen">0</b></div><div class="kpi"><span>處理中</span><b id="kpiProgress">0</b></div><div class="kpi"><span>等待回覆／財務</span><b id="kpiWaiting">0</b></div><div class="kpi"><span>已結案</span><b id="kpiDone">0</b></div></section>
    <main class="workspace">
      <section class="panel"><div class="panel-head"><div><div class="panel-title">客服案件</div><div class="panel-sub">先選案件，再在右側處理。</div></div></div><div class="panel-body"><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="open">待處理</button><button class="filter" data-filter="progress">處理中</button><button class="filter" data-filter="waiting">等待回覆</button><button class="filter" data-filter="done">已結案</button></div><input id="search" class="search" placeholder="搜尋案件、訂單、姓名或電話"><div id="caseList" class="case-list"><div class="empty">讀取中…</div></div></div></section>
      <section id="detail" class="panel"><div class="detail-empty">請先選擇一筆案件。</div></section>
    </main>
  </div>
</div>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal"><div class="modal-head"><div><b id="modalTitle">案件操作</b><div class="panel-sub" id="modalSub"></div></div><button class="close" onclick="closeModal()">×</button></div><div id="modalBody" class="modal-body"></div></div></div><div id="toast" class="toast"></div>
<script>
'use strict';
const API_BASE=location.origin;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const money=v=>'NT$'+Math.round(Number(v||0)).toLocaleString('zh-TW');
let cases=[];let selectedId='';let selectedDetail=null;let filter='all';
function fmtTime(ms){const n=Number(ms||0);return n?new Date(n).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'-'}
function statusLabel(s){return {OPEN:'待處理',IN_PROGRESS:'處理中',WAITING_USER:'等待回覆',WAITING_FINANCE:'財務審核中',RESOLVED:'已結案',CLOSED:'已關閉'}[s]||s||'-'}
function statusClass(s){return s==='OPEN'?'open':s==='IN_PROGRESS'?'progress':['WAITING_USER','WAITING_FINANCE'].includes(s)?'wait':'done'}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3000)}
async function readJson(res){const data=await res.json().catch(()=>({}));if(!res.ok||data.success===false)throw new Error(data.message||data.error||`HTTP ${res.status}`);return data}
function key(){return sessionStorage.getItem('ubee_support_admin_key')||localStorage.getItem('ubee_support_admin_key_saved')||''}
function operator(){return localStorage.getItem('ubee_support_operator')||'Charles'}
function headers(){return {'Content-Type':'application/json','X-UBee-Support-Admin-Key':key(),'X-UBee-Support-Operator':operator()}}
async function api(path,opt={}){return readJson(await fetch(API_BASE+path,{cache:'no-store',...opt,headers:{...headers(),...(opt.headers||{})}}))}

async function login(){const k=$('adminKey').value.trim(),op=$('operator').value.trim()||'Charles';if(!k)return alert('請輸入客服管理密碼。');sessionStorage.setItem('ubee_support_admin_key',k);localStorage.setItem('ubee_support_operator',op);if($('rememberKey').checked)localStorage.setItem('ubee_support_admin_key_saved',k);else localStorage.removeItem('ubee_support_admin_key_saved');try{await api('/api/admin/support/cases?limit=1');showDashboard();loadCases()}catch(err){sessionStorage.removeItem('ubee_support_admin_key');alert('登入失敗：'+err.message)}}
function logout(){sessionStorage.removeItem('ubee_support_admin_key');localStorage.removeItem('ubee_support_admin_key_saved');location.reload()}
function showDashboard(){$('loginScreen').classList.add('hidden');$('dashboard').classList.remove('hidden');$('operatorText').textContent=`目前操作人員：${operator()}`}
async function loadCases(){try{const data=await api('/api/admin/support/cases?limit=500');cases=data.cases||[];updateKpis();renderCases();if(selectedId&&cases.some(c=>c.caseId===selectedId))loadDetail(selectedId)}catch(err){if(/金鑰|不正確|401/.test(err.message))return logout();$('caseList').innerHTML=`<div class="empty">讀取失敗：${esc(err.message)}</div>`}}
function updateKpis(){$('kpiOpen').textContent=cases.filter(c=>c.status==='OPEN').length;$('kpiProgress').textContent=cases.filter(c=>c.status==='IN_PROGRESS').length;$('kpiWaiting').textContent=cases.filter(c=>['WAITING_USER','WAITING_FINANCE'].includes(c.status)).length;$('kpiDone').textContent=cases.filter(c=>['RESOLVED','CLOSED'].includes(c.status)).length}
function matchesFilter(c){if(filter==='open')return c.status==='OPEN';if(filter==='progress')return c.status==='IN_PROGRESS';if(filter==='waiting')return ['WAITING_USER','WAITING_FINANCE'].includes(c.status);if(filter==='done')return ['RESOLVED','CLOSED'].includes(c.status);return true}
function renderCases(){const q=$('search').value.trim().toLowerCase();const list=cases.filter(matchesFilter).filter(c=>!q||[c.caseId,c.orderId,c.orderNo,c.sourceName,c.contactPhone,c.title,c.description].some(v=>String(v||'').toLowerCase().includes(q)));$('caseList').innerHTML=list.length?list.map(c=>`<button class="case-card ${c.caseId===selectedId?'active':''}" onclick="loadDetail('${esc(c.caseId)}')"><div class="case-top"><div class="case-title">${esc(c.categoryLabel||c.title||'客服案件')}</div><span class="status ${statusClass(c.status)}">${esc(statusLabel(c.status))}</span></div><div class="case-meta">${esc(c.caseId)}${c.orderId?`・訂單 ${esc(c.orderId)}`:''}<br>${esc(c.sourceName||c.contactPhone||c.sourceRole||'-')}・${esc(fmtTime(c.updatedAtMs))}</div></button>`).join(''):'<div class="empty">目前沒有符合條件的案件。</div>'}
document.querySelectorAll('.filter').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===btn));renderCases()});$('search').addEventListener('input',renderCases);
async function loadDetail(id){selectedId=id;renderCases();$('detail').innerHTML='<div class="detail-empty">讀取案件中…</div>';try{selectedDetail=await api(`/api/admin/support/cases/${encodeURIComponent(id)}?t=${Date.now()}`);renderDetail()}catch(err){$('detail').innerHTML=`<div class="detail-empty">${esc(err.message)}</div>`}}
function renderDetail(){const d=selectedDetail,c=d.case||{},events=d.events||[],evidence=d.evidence||[],finance=d.finance||{};const done=['RESOLVED','CLOSED'].includes(c.status);$('detail').innerHTML=`<div class="detail-head"><small>${esc(c.caseId||'')}</small><h2>${esc(c.categoryLabel||c.title||'客服案件')}</h2><p>${esc(statusLabel(c.status))}${c.orderId?`・訂單 ${esc(c.orderId)}`:''}</p></div><div class="detail-body"><div class="action-grid">${!done?`<button class="btn primary" onclick="startCase()">開始處理</button><button class="btn blue" onclick="openTextAction('PUBLIC_REPLY','回覆客戶','輸入客戶看得到的回覆')">回覆客戶</button><button class="btn" onclick="openTextAction('WAIT_USER','等待客戶回覆','請說明需要補充什麼資料')">等待回覆</button><button class="btn" onclick="openTextAction('INTERNAL_NOTE','內部備註','只有 UBee 內部看得到')">內部備註</button>${c.orderId?`<button class="btn yellow" onclick="openRefund()">申請退款審核</button>`:''}<button class="btn green" onclick="openTextAction('RESOLVE','結案','請填寫完整處理結果')">結案</button>`:`<button class="btn yellow" onclick="openTextAction('REOPEN','重新開啟','請說明重新開啟原因')">重新開啟</button>`}</div><div class="info-grid"><div class="info"><span>案件來源</span><b>${esc(c.sourceRole||'-')}・${esc(c.sourceName||'-')}</b></div><div class="info"><span>聯絡電話</span><b>${esc(c.contactPhone||'-')}</b></div><div class="info"><span>負責人</span><b>${esc(c.assignedTo||'尚未指派')}</b></div><div class="info"><span>建立時間</span><b>${esc(fmtTime(c.createdAtMs))}</b></div><div class="info"><span>退款狀態</span><b>${esc(c.refundRequestStatus||'未申請')}${c.refundRequestedAmount?`・${money(c.refundRequestedAmount)}`:''}</b></div><div class="info"><span>客戶實收</span><b>${money(finance.actualPaidAmount||finance.finalCustomerTotal)}</b></div></div><div class="section-title">問題說明</div><div class="note">${esc(c.description||'')}</div>${c.latestPublicReply?`<div class="section-title">最近對外回覆</div><div class="note" style="background:#fff8d5">${esc(c.latestPublicReply)}</div>`:''}${c.latestInternalNote?`<div class="section-title">最近內部備註</div><div class="note">${esc(c.latestInternalNote)}</div>`:''}<div class="section-title">任務證據</div><div class="evidence">${evidence.length?evidence.map(e=>e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.evidenceTypeLabel||'證據')}<br>${esc(e.originalName||'開啟檔案')}</a>`:`<div class="note">${esc(e.originalName||'證據檔案')}</div>`).join(''):'<div class="note">目前沒有上傳證據。</div>'}</div><div class="section-title">處理時間軸</div><div class="timeline">${events.length?events.map(e=>`<div class="event"><div class="dot"></div><div><b>${esc(e.title||e.type)}</b><p>${esc(e.message||'')}</p><small>${esc(fmtTime(e.createdAtMs))}・${esc(e.operator||'UBee')}</small></div></div>`).join(''):'<div class="empty">目前沒有處理紀錄。</div>'}</div></div>`}
async function action(type,payload={}){await api(`/api/admin/support/cases/${encodeURIComponent(selectedId)}/action`,{method:'POST',body:JSON.stringify({action:type,operator:operator(),...payload})});closeModal();toast('案件已更新');await loadCases()}
async function startCase(){try{const c=selectedDetail?.case||{};if(!c.assignedTo)await action('ASSIGN',{assignedTo:operator()});await action('START',{message:'UBee 客服已開始處理此案件。'})}catch(err){alert(err.message)}}
function openTextAction(type,title,placeholder){openModal(title,'',`<textarea id="modalText" class="textarea" placeholder="${esc(placeholder)}"></textarea><button class="btn primary" style="width:100%;margin-top:12px" onclick="submitTextAction('${esc(type)}')">確認送出</button>`)}
async function submitTextAction(type){const message=$('modalText').value.trim();if(!message)return alert('請填寫內容。');try{await action(type,{message})}catch(err){alert(err.message)}}
function openRefund(){const f=selectedDetail?.finance||{};openModal('送交財務退款審核','這不會直接退款。',`<div class="field"><label>退款申請金額</label><input id="refundAmount" class="input" type="number" min="1" value="${Number(f.actualPaidAmount||f.finalCustomerTotal||0)}"></div><div class="field"><label>退款原因</label><textarea id="refundReason" class="textarea" placeholder="請說明退款原因與判斷依據"></textarea></div><button class="btn yellow" style="width:100%;margin-top:12px" onclick="submitRefund()">送交財務審核</button>`)}
async function submitRefund(){const amount=Number($('refundAmount').value||0),reason=$('refundReason').value.trim();if(amount<=0||!reason)return alert('請填寫退款金額與原因。');try{await api(`/api/admin/support/cases/${encodeURIComponent(selectedId)}/refund-request`,{method:'POST',body:JSON.stringify({amount,reason,operator:operator()})});closeModal();toast('已送交財務審核');await loadCases()}catch(err){alert(err.message)}}
function openModal(title,sub,body){$('modalTitle').textContent=title;$('modalSub').textContent=sub||'';$('modalBody').innerHTML=body;$('modalBackdrop').classList.add('show')}
function closeModal(){$('modalBackdrop').classList.remove('show')}

(function init(){const saved=localStorage.getItem('ubee_support_admin_key_saved');$('operator').value=operator();if(saved){$('adminKey').value=saved;$('rememberKey').checked=true;sessionStorage.setItem('ubee_support_admin_key',saved);showDashboard();loadCases()}else if(sessionStorage.getItem('ubee_support_admin_key')){showDashboard();loadCases()}})();
</script>
</body>
</html>
