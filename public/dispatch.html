<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UBee Dispatch V6.4.0 — Native Dispatch Management RC1</title><style>
:root{--orange:#ef784d;--bg:#f5f5f7;--ink:#171717;--muted:#737780;--line:#e9e9ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:white;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;font-size:22px}.brand b{color:#efb41c}.sub{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 13px;font-weight:750}.btn.dark{background:#151515;color:white}.btn.orange{background:var(--orange);color:white;border-color:var(--orange)}.nav{display:flex;gap:7px;overflow-x:auto;padding:12px 0;scrollbar-width:none}.nav button{border:0;background:#fff;border-radius:12px;padding:12px 16px;white-space:nowrap;font-weight:800}.nav button.active{background:var(--orange);color:white}.page{display:none}.page.active{display:block}.hero{background:var(--orange);color:white;border-radius:22px 22px 0 0;text-align:center;padding:56px 15px 100px}.hero h1{font-size:40px;margin:0}.hero p{margin:8px 0 0}.stats{margin:-72px 14px 20px;position:relative;background:white;border-radius:20px;padding:20px 12px;box-shadow:0 7px 25px #00000008}.stats h2{margin:0 0 20px;font-size:20px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.statrow>div+div{border-left:1px solid var(--line)}.statrow b{font-size:30px;color:var(--orange);display:block}.statrow span{font-size:13px;color:var(--muted)}.card{background:white;border-radius:18px;padding:20px;margin:12px 0}.card h2{margin:0 0 18px;font-size:20px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tile{min-height:130px;border:1px solid var(--line);border-radius:17px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:850}.tile span{font-size:28px;color:var(--orange)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#f7f7f8;margin-bottom:12px}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:14px}.tabs button{flex:1;white-space:nowrap;border:0;border-radius:10px;background:#f0f0f2;padding:11px 8px}.tabs button.active{background:#161616;color:white}.entry{border-bottom:1px solid var(--line);padding:15px 0}.entry:last-child{border:0}.entry strong{font-size:15px}.meta{color:var(--muted);font-size:12px;line-height:1.8;margin-top:6px;overflow-wrap:anywhere}.tag{display:inline-block;border-radius:9px;background:#fff0e9;color:#bd542f;padding:3px 7px;font-size:11px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.detail{border:1px solid var(--line);background:#fafafa;padding:15px;border-radius:14px;margin:12px 0}.empty{text-align:center;color:#8c8f95;padding:40px 10px}.notice{color:#8a5400;background:#fff7df;border-radius:12px;padding:12px;font-size:12px;line-height:1.6}.error{color:#ac2525;background:#fff0f0;border-radius:12px;padding:12px;margin-top:10px}.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.dialog{background:white;border-radius:20px;padding:25px;width:min(420px,100%)}.dialog input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;margin:15px 0}.hidden{display:none!important}@media(min-width:800px){.content{display:grid;grid-template-columns:1fr 1fr;gap:16px}.content>.card{margin:0}.hero{padding:50px 20px 110px}.tiles{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.wrap{padding:10px}.top{align-items:flex-start}.brand{font-size:19px}.actions{flex-direction:column}.actions .btn{padding:7px 9px;font-size:12px}.nav{position:sticky;top:0;background:var(--bg);z-index:5}.nav button{padding:11px 12px;font-size:13px}.hero{padding:50px 10px 95px}.stats{margin-left:10px;margin-right:10px}.card{padding:16px}.tile{min-height:112px}.statrow b{font-size:27px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">U<b>Bee</b> 調度中心</div><div class="sub">V6.4.0 · Native Dispatch Management RC1</div><div class="sub" id="updated">尚未更新</div></div><div class="actions"><button class="btn dark" id="refresh">重新整理</button><button class="btn" id="lock">鎖定</button></div></header><nav class="nav" id="nav"><button class="active" data-page="home">首頁</button><button data-page="orders">訂單管理</button><button data-page="riders">小U管理</button><button data-page="incidents">異常案件</button></nav><div id="error" class="error hidden"></div>
<section class="page active" id="home"><div class="hero"><h1>首頁</h1><p>UBee 智慧調度中心</p></div><div class="stats"><h2>待處理事項</h2><div class="statrow"><div><b id="waitCount">—</b><span>待指派訂單</span></div><div><b id="pickupCount">—</b><span>小U待取</span></div><div><b id="deliveryCount">—</b><span>配送中</span></div></div></div><div class="card"><h2>功能入口</h2><div class="tiles"><button class="tile" data-go="orders"><span>▤</span>訂單管理</button><button class="tile" data-go="riders"><span>♟</span>小U管理</button><button class="tile" data-go="incidents"><span>!</span>異常案件</button><button class="tile" id="refreshTile"><span>↻</span>重新整理</button></div></div></section>
<section class="page" id="orders"><div class="card"><h2>訂單管理</h2><input id="orderSearch" class="search" placeholder="搜尋訂單編號、地址、客戶或小U"><div class="tabs" id="orderTabs"><button class="active" data-filter="waiting">待指派</button><button data-filter="pickup">小U待取</button><button data-filter="delivery">配送中</button><button data-filter="all">所有</button></div><div id="orderList"></div></div><div class="card"><h2>訂單詳情與調度</h2><div id="orderDetail" class="empty">請先選擇一筆訂單</div></div></section>
<section class="page" id="riders"><div class="card"><h2>小U管理</h2><input id="riderSearch" class="search" placeholder="搜尋小U姓名、編號、電話後四碼"><div class="tabs" id="riderTabs"><button class="active" data-filter="all">全部</button><button data-filter="online">在線</button><button data-filter="busy">任務中</button><button data-filter="offline">離線</button></div><div id="riderList"></div></div></section>
<section class="page" id="incidents"><div class="card"><h2>異常案件</h2><div class="tabs" id="incidentTabs"><button class="active" data-filter="active">待處理</button><button data-filter="all">全部</button></div><div id="incidentList"></div></div></section></div>
<div class="overlay" id="auth"><form class="dialog" id="authForm"><h2>調度中心管理驗證</h2><p class="sub">使用 Render 已設定的 DISPATCH_ADMIN_KEY。金鑰僅保存在本頁記憶體中。</p><input id="key" type="password" autocomplete="off" placeholder="輸入管理金鑰" required><button class="btn orange" type="submit">驗證並進入</button><div id="authError" class="error hidden"></div></form></div>
<script>
'use strict';
const $=id=>document.getElementById(id), escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={key:'',data:{orders:[],riders:[],incidents:[],intelligence:{}},page:'home',orderFilter:'waiting',riderFilter:'all',incidentFilter:'active',selected:'',loading:false};
const idOf=r=>String(r?.id??r?.riderId??r?.riderDocId??'');
const orderKind=o=>{const s=String(o?.status||'').toLowerCase();if(['pending','waiting','unassigned','created','open','searching','awaiting_dispatch','pending_dispatch'].includes(s))return 'waiting';if(['accepted','going_to_pickup','heading_to_pickup','arrived_at_pickup','at_pickup'].includes(s))return 'pickup';if(['picked_up','delivering','in_delivery','going_to_dropoff','heading_to_dropoff','arrived_at_dropoff','in_progress','queued'].includes(s))return 'delivery';return 'other'};
function setError(msg=''){const el=$('error');el.textContent=msg;el.classList.toggle('hidden',!msg)}
async function request(path,options={}){if(!S.key)throw Error('請先完成管理驗證');const h=new Headers(options.headers||{});h.set('X-UBee-Dispatch-Admin-Key',S.key);h.set('Accept','application/json');const res=await fetch(path,{...options,headers:h,credentials:'same-origin',cache:'no-store'});const data=await res.json().catch(()=>({}));if(res.status===401||res.status===403){lock();throw Error('管理授權失效，請重新驗證')}if(!res.ok||data.success===false)throw Error(data.message||`HTTP ${res.status}`);return data}
function lock(){S.key='';$('auth').classList.remove('hidden');$('key').value=''}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const candidate=$('key').value.trim();$('authError').classList.add('hidden');try{const res=await fetch('/api/dispatch/auth/check',{headers:{'X-UBee-Dispatch-Admin-Key':candidate,'Accept':'application/json'},cache:'no-store'});const d=await res.json().catch(()=>({}));if(!res.ok||d.success!==true)throw Error(d.message||'驗證失敗');S.key=candidate;$('key').value='';$('auth').classList.add('hidden');await refresh()}catch(err){S.key='';$('authError').textContent=err.message;$('authError').classList.remove('hidden')}});
$('lock').onclick=lock;$('refresh').onclick=refresh;$('refreshTile').onclick=refresh;
function page(name){S.page=name;document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id===name));document.querySelectorAll('#nav button').forEach(e=>e.classList.toggle('active',e.dataset.page===name));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>page(b.dataset.go));
for(const [root,field] of [['orderTabs','orderFilter'],['riderTabs','riderFilter'],['incidentTabs','incidentFilter']])$(root).querySelectorAll('button').forEach(b=>b.onclick=()=>{S[field]=b.dataset.filter;$(root).querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('orderSearch').oninput=render;$('riderSearch').oninput=render;
async function refresh(){if(!S.key||S.loading)return;S.loading=true;$('refresh').disabled=true;try{const d=await request('/api/dispatch/dashboard');S.data={orders:Array.isArray(d.orders)?d.orders:[],riders:Array.isArray(d.riders)?d.riders:[],incidents:Array.isArray(d.incidents)?d.incidents:[],intelligence:d.intelligence||{}};if(S.selected&&!S.data.orders.some(o=>String(o.id)===S.selected))S.selected='';$('updated').textContent='更新時間 '+new Date(d.generatedAtMs||Date.now()).toLocaleTimeString('zh-TW');setError();render()}catch(err){setError('調度中心讀取失敗：'+err.message)}finally{S.loading=false;$('refresh').disabled=false}}
function render(){const orders=S.data.orders;for(const [id,kind] of [['waitCount','waiting'],['pickupCount','pickup'],['deliveryCount','delivery']])$(id).textContent=orders.filter(o=>orderKind(o)===kind).length;renderOrders();renderRiders();renderIncidents()}
function renderOrders(){const q=$('orderSearch').value.trim().toLowerCase();const list=S.data.orders.filter(o=>(S.orderFilter==='all'||orderKind(o)===S.orderFilter)&&(!q||JSON.stringify([o.id,o.pickupAddress,o.dropoffAddress,o.customerName,o.riderName]).toLowerCase().includes(q)));$('orderList').innerHTML=list.length?list.map(o=>`<div class="entry"><div class="row"><strong>${escapeHtml(o.id||'未編號訂單')}</strong><span class="tag">${escapeHtml(o.status||'未知狀態')}</span></div><div class="meta">${escapeHtml(o.serviceType||o.serviceCategory||'UBee 任務')}<br>取件：${escapeHtml(o.pickupAddress||'未提供')}<br>送達：${escapeHtml(o.dropoffAddress||'未提供')}<br>小U：${escapeHtml(o.riderName||'尚未指派')}</div><button class="btn" data-select="${escapeHtml(o.id)}">查看與調度</button></div>`).join(''):'<div class="empty">目前沒有符合條件的訂單</div>';$('orderList').querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{S.selected=b.dataset.select;renderDetail()});renderDetail()}
function renderDetail(){const o=S.data.orders.find(x=>String(x.id)===S.selected);if(!o){$('orderDetail').innerHTML='<div class="empty">請先選擇一筆訂單</div>';return}const waiting=orderKind(o)==='waiting';const pickup=orderKind(o)==='pickup';const candidates=S.data.intelligence?.orderInsights?.find(x=>String(x.orderId||x.id)===String(o.id))?.candidates||[];const known=new Map(S.data.riders.map(r=>[idOf(r),r]));const list=Array.isArray(candidates)&&candidates.length?candidates.map(c=>({...known.get(idOf(c)),...c,verified:true})):S.data.riders.filter(r=>r.online===true&&r.busy!==true).map(r=>({...r,verified:false}));$('orderDetail').innerHTML=`<strong>${escapeHtml(o.id)}</strong><div class="meta">狀態：${escapeHtml(o.status)}<br>取件：${escapeHtml(o.pickupAddress||'未提供')}<br>送達：${escapeHtml(o.dropoffAddress||'未提供')}<br>目前小U：${escapeHtml(o.riderName||'未指派')}</div><div class="notice">正式派單資格由後端最終判定；清單不是派單保證。取件後或貨物已交接的訂單，不提供一般解除派單。</div>${waiting?`<h3>小U候選／在線參考</h3>${list.length?list.map(r=>`<div class="entry row"><div><strong>${escapeHtml(r.name||r.riderName||r.riderId||'小U')}</strong><div class="meta">${r.verified?'後端候選':'在線參考，未驗證資格'} · ${escapeHtml(r.district||r.serviceArea||'未提供服務區')}</div></div><button class="btn orange" data-assign="${escapeHtml(r.riderId||r.riderDocId||r.id||'')}" ${r.verified?'':'disabled'}>指定</button></div>`).join(''):'<div class="empty">目前沒有候選小U</div>'}<div class="toolbar"><button class="btn" data-action="redispatch">重新媒合</button></div>`:pickup?'<div class="toolbar"><button class="btn" data-action="unassign">取消派單</button></div>':''}`; $('orderDetail').querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>operate('assign',b.dataset.assign));$('orderDetail').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>operate(b.dataset.action))}
async function operate(action,riderId=''){const o=S.data.orders.find(x=>String(x.id)===S.selected);if(!o)return;let body={source:'dispatch_center'};if(action==='assign'){if(!riderId)return;body.riderId=riderId}else if(action==='unassign'){if(orderKind(o)!=='pickup'||o.custodyLocked===true)return alert('此任務不符合安全解除條件');body.reason='調度中心人工重新安排'}else if(action!=='redispatch')return;if(!confirm(`確認對訂單 ${o.id} 執行${{assign:'指定小U',unassign:'取消派單',redispatch:'重新媒合'}[action]}？`))return;try{const d=await request(`/api/dispatch/orders/${encodeURIComponent(o.id)}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert(d.message||'操作成功');await refresh()}catch(err){alert('操作失敗：'+err.message)}}
function renderRiders(){const q=$('riderSearch').value.trim().toLowerCase();const list=S.data.riders.filter(r=>{const online=r.online===true,busy=r.busy===true;return(S.riderFilter==='all'||(S.riderFilter==='online'&&online)||(S.riderFilter==='busy'&&busy)||(S.riderFilter==='offline'&&!online))&&(!q||JSON.stringify([r.name,r.riderId,r.phone,r.riderDocId]).toLowerCase().includes(q))});$('riderList').innerHTML=list.length?list.map(r=>`<div class="entry"><div class="row"><strong>${escapeHtml(r.name||r.riderId||'小U')}</strong><span class="tag">${r.online===true?'在線':'離線'} · ${r.busy===true?'任務中':'非任務中'}</span></div><div class="meta">小U編號：${escapeHtml(r.riderId||r.id||'未提供')}<br>接單狀態：${escapeHtml(r.acceptingOrders===false?'關閉':r.acceptingOrders===true?'開啟':'依後端狀態')}<br>服務區：${escapeHtml(r.district||r.serviceArea||'未提供')}<br>最後定位：${r.locationUpdatedAtMs?new Date(Number(r.locationUpdatedAtMs)).toLocaleString('zh-TW'):'未提供'}<br>座標：${Number.isFinite(Number(r.currentLat))&&Number.isFinite(Number(r.currentLng))&&r.currentLat!=null&&r.currentLng!=null?`${escapeHtml(r.currentLat)}, ${escapeHtml(r.currentLng)}`:'無定位資料'}</div></div>`).join(''):'<div class="empty">目前沒有符合條件的小U</div>'}
function renderIncidents(){const list=S.data.incidents.filter(x=>S.incidentFilter==='all'||!['RESOLVED','CLOSED'].includes(String(x.status||'').toUpperCase()));$('incidentList').innerHTML=list.length?list.map(x=>`<div class="entry"><div class="row"><strong>${escapeHtml(x.title||x.type||'異常案件')}</strong><span class="tag">${escapeHtml(x.status||'未標示')}</span></div><div class="meta">訂單：${escapeHtml(x.orderId||'未提供')}<br>嚴重程度：${escapeHtml(x.severity||'未提供')}<br>${escapeHtml(x.description||'')}</div></div>`).join(''):'<div class="empty">目前沒有符合條件的異常案件</div>'}
setInterval(()=>{if(S.key&&!document.hidden)refresh()},15000);
</script></body></html>
