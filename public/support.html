<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UBee 跑腿｜客服中心</title>
<style>
:root{--bg:#f5f6f7;--card:#fff;--text:#111;--muted:#73777d;--line:#e7e8ea;--yellow:#facc15;--yellow2:#f4bd00;--green:#16834f;--blue:#2768d7;--red:#d93b42;--shadow:0 12px 32px rgba(17,24,39,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding:0 14px 110px}.topbar{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(11px + env(safe-area-inset-top)) 14px 11px;background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr 44px;align-items:center}.logo{text-align:center;font-size:22px;font-weight:1000}.logo span{color:var(--yellow2)}.icon-btn{width:40px;height:40px;border:0;border-radius:14px;background:#f1f2f4;color:#111;font-weight:1000}.hero{padding:22px 3px 15px}.hero h1{font-size:29px;line-height:1.2;margin:0;font-weight:1000;letter-spacing:-.7px}.hero p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.65;font-weight:750}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow);margin-bottom:13px}.step-head{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px}.step-no{width:31px;height:31px;flex:0 0 31px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-size:13px;font-weight:1000}.step-title{font-size:18px;font-weight:1000}.step-sub{font-size:12px;color:var(--muted);line-height:1.5;margin-top:3px;font-weight:800}.field{margin-top:12px}.field:first-child{margin-top:0}label{display:block;font-size:13px;font-weight:1000;margin-bottom:7px}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:#fafafa;color:#111;outline:0;padding:14px;font-size:16px}.textarea{min-height:120px;resize:vertical;line-height:1.65}.input:focus,.textarea:focus{border-color:#d9bd42;box-shadow:0 0 0 4px rgba(250,204,21,.16);background:#fff}.optional{color:#999;font-weight:800;font-size:11px}.issue-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.issue{min-height:82px;border:1px solid var(--line);border-radius:18px;background:#fafafa;padding:12px 9px;text-align:center;color:#6f7378;font-weight:950}.issue i{display:block;font-style:normal;font-size:25px;margin-bottom:6px}.issue.active{background:#fff8d5;border-color:#e2c344;color:#111;box-shadow:0 0 0 1px #e2c344 inset}.btn{width:100%;border:0;border-radius:17px;padding:15px;font-size:16px;font-weight:1000;background:#111;color:#fff}.btn.yellow{background:var(--yellow);color:#111}.btn.light{background:#fff;color:#111;border:1px solid var(--line)}.btn.small{width:auto;padding:9px 12px;border-radius:12px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.button-row{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}.no-order{display:flex;align-items:center;gap:8px;margin-top:11px;color:#666;font-size:13px;font-weight:900}.no-order input{width:19px;height:19px}.upload-box{margin-top:12px;padding:13px;border:1px dashed #cfd2d6;border-radius:16px;background:#fafafa}.upload-box input{width:100%}.file-name{margin-top:8px;font-size:12px;color:var(--muted);font-weight:850;word-break:break-all}.privacy{margin-top:12px;padding:11px 12px;border-radius:14px;background:#f7f7f8;color:#666;font-size:11px;line-height:1.65;font-weight:800}.success{display:none;text-align:center;padding:27px 16px}.success.show{display:block}.success-icon{width:68px;height:68px;border-radius:23px;background:#e9f8ef;color:var(--green);font-size:34px;font-weight:1000;display:flex;align-items:center;justify-content:center;margin:0 auto 15px}.case-number{font-size:20px;font-weight:1000;margin:12px 0;padding:12px;border-radius:14px;background:#f5f6f7;word-break:break-all}.status-card{background:#111;color:#fff;border-radius:24px;padding:19px;margin-bottom:13px}.status-card .case{font-size:12px;color:#bbb;font-weight:850}.status-card h2{font-size:25px;margin:8px 0 6px}.status-card p{margin:0;color:#d1d3d6;line-height:1.6;font-size:13px}.detail-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.section-title{font-size:15px;font-weight:1000;margin-bottom:10px}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:20px 1fr;gap:10px;position:relative;padding-bottom:16px}.event:not(:last-child):before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:#e4e6e8}.dot{width:18px;height:18px;border-radius:50%;background:#111;border:4px solid #f1f2f4;z-index:1}.event b{display:block;font-size:13px}.event p{margin:4px 0;color:#666;font-size:12px;line-height:1.55;white-space:pre-line}.event small{color:#999;font-size:10px}.saved-list{display:grid;gap:9px}.saved-case{border:1px solid var(--line);border-radius:17px;background:#fff;padding:13px;text-align:left}.saved-case b{display:block;font-size:13px}.saved-case span{display:block;margin-top:5px;color:var(--muted);font-size:11px}.empty{text-align:center;color:#999;padding:30px 10px;font-size:13px;line-height:1.65}.advanced{margin-top:14px}.advanced summary{font-size:12px;color:#777;font-weight:900;cursor:pointer}.advanced-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid var(--line);box-shadow:0 -8px 25px rgba(17,24,39,.07)}.nav-btn{border:0;background:transparent;border-radius:15px;padding:9px;color:#8a8e93;font-size:11px;font-weight:1000}.nav-btn span{display:block;font-size:20px;margin-bottom:3px}.nav-btn.active{background:#111;color:#fff}.nav-btn.active span{color:var(--yellow)}.toast{position:fixed;z-index:100;left:50%;bottom:92px;transform:translateX(-50%);max-width:calc(100% - 28px);background:#111;color:#fff;padding:11px 14px;border-radius:13px;font-size:12px;font-weight:900;display:none}.toast.show{display:block}@media(max-width:370px){.issue-grid{grid-template-columns:1fr}.hero h1{font-size:26px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><button class="icon-btn" onclick="history.length>1?history.back():location.href='/order.html'">‹</button><div class="logo">U<span>Bee</span> 客服中心</div><div></div></header>

  <section id="view-create" class="view active">
    <div class="hero"><h1>告訴我們發生什麼事</h1><p>三個步驟就能送出，客服會依訂單資料協助處理。</p></div>

    <div id="createFormArea">
      <div class="card">
        <div class="step-head"><div class="step-no">1</div><div><div class="step-title">找到你的訂單</div><div class="step-sub">輸入訂單編號與下單時留下的電話。</div></div></div>
        <input id="sourceRole" type="hidden" value="customer">
        <input id="sourceIdentifier" type="hidden" value="">
        <div class="field"><label>訂單編號</label><input id="orderId" class="input" autocomplete="off" placeholder="例如：UB2026... 或 UBM2026..."></div>
        <div class="field"><label>聯絡電話</label><input id="phone" class="input" type="tel" inputmode="tel" maxlength="20" placeholder="例如：0912345678"></div>
        <div class="field"><label>怎麼稱呼你 <span class="optional">選填</span></label><input id="name" class="input" maxlength="60" placeholder="例如：陳先生"></div>
        <label class="no-order"><input id="noOrder" type="checkbox" onchange="toggleNoOrder()">我沒有訂單，只想詢問一般問題</label>
      </div>

      <div class="card">
        <div class="step-head"><div class="step-no">2</div><div><div class="step-title">選擇遇到的問題</div><div class="step-sub">點選最接近的項目即可。</div></div></div>
        <div class="issue-grid" id="issueGrid">
          <button class="issue" data-category="DELIVERY_DELAY"><i>⏱</i>配送太久</button>
          <button class="issue" data-category="ITEM_DAMAGED"><i>📦</i>商品損壞／缺件</button>
          <button class="issue" data-category="NOT_RECEIVED"><i>❓</i>沒有收到商品</button>
          <button class="issue" data-category="AMOUNT_DISPUTE"><i>＄</i>金額有問題</button>
          <button class="issue" data-category="SERVICE_ATTITUDE"><i>💬</i>服務態度問題</button>
          <button class="issue" data-category="OTHER"><i>•••</i>其他問題</button>
        </div>
      </div>

      <div class="card">
        <div class="step-head"><div class="step-no">3</div><div><div class="step-title">簡單說明並送出</div><div class="step-sub">請寫下事情經過，照片可以之後再補。</div></div></div>
        <div class="field"><label>發生什麼事情？</label><textarea id="description" class="textarea" maxlength="3000" placeholder="例如：商品送達時外盒破損，裡面的飲料灑出來了。"></textarea></div>
        <div class="upload-box" id="uploadBox"><label>上傳照片或收據 <span class="optional">選填，最多 1 個檔案</span></label><input id="evidenceFile" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf"><div id="fileName" class="file-name"></div></div>
        <div class="privacy">送出後，系統會自動保存案件查詢資料在這台裝置。你不需要記住複雜的查詢憑證。</div>
        <div class="button-row"><button id="submitBtn" class="btn yellow" onclick="submitCase()">送出客服案件</button></div>
      </div>
    </div>

    <div id="successBox" class="card success">
      <div class="success-icon">✓</div><h2>案件已成立</h2><p>UBee 客服會盡快處理，你可以在「我的案件」查看最新進度。</p><div id="successCaseId" class="case-number"></div><button class="btn yellow" onclick="openLatestCase()">查看案件進度</button><button class="btn light" style="margin-top:9px" onclick="resetForm()">再建立一筆案件</button>
    </div>
  </section>

  <section id="view-cases" class="view">
    <div class="hero"><h1>我的客服案件</h1><p>這台裝置建立過的案件會自動保存在這裡。</p></div>
    <div class="card"><div id="savedCases" class="saved-list"></div>
      <details class="advanced"><summary>換裝置或資料不在這裡？使用案件憑證查詢</summary><div class="advanced-body"><div class="field"><label>案件編號</label><input id="manualCaseId" class="input" placeholder="UBS2026..."></div><div class="field"><label>查詢憑證</label><input id="manualToken" class="input" type="password" placeholder="建立案件時取得的憑證"></div><button class="btn light" style="margin-top:12px" onclick="manualLookup()">查詢案件</button></div></details>
    </div>
    <div id="caseDetail"></div>
  </section>
</div>

<nav class="bottom-nav"><button class="nav-btn active" data-view="create" onclick="switchView('create')"><span>＋</span>提出問題</button><button class="nav-btn" data-view="cases" onclick="switchView('cases')"><span>▤</span>我的案件</button></nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
const API_BASE=location.origin;
const STORAGE_KEY='ubee_support_simple_cases_v2';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let selectedCategory='';
let storageEnabled=false;
let loading=false;

function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3000)}
async function readJson(res){const data=await res.json().catch(()=>({}));if(!res.ok||data.success===false)throw new Error(data.message||data.error||`HTTP ${res.status}`);return data}
function fmtTime(ms){const n=Number(ms||0);return n?new Date(n).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'-'}
function statusInfo(s){return {OPEN:['等待客服處理','案件已送出，客服會盡快查看。'],IN_PROGRESS:['客服處理中','客服正在確認訂單與相關資料。'],WAITING_USER:['等待你的回覆','客服需要你補充資料，請查看處理紀錄。'],WAITING_FINANCE:['財務審核中','退款或金額事項已送交財務確認。'],RESOLVED:['案件已完成','客服已完成處理。'],CLOSED:['案件已關閉','本案件已正式關閉。']}[s]||['處理中','案件狀態更新中。']}
function getSaved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch{return []}}
function saveCredential(item){const list=getSaved().filter(x=>x.caseId!==item.caseId);list.unshift(item);localStorage.setItem(STORAGE_KEY,JSON.stringify(list.slice(0,10)))}
function switchView(view){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===`view-${view}`));document.querySelectorAll('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.view===view));if(view==='cases')renderSavedCases();scrollTo({top:0,behavior:'smooth'})}
function toggleNoOrder(){const checked=$('noOrder').checked;$('orderId').disabled=checked;if(checked){$('orderId').value='';selectedCategory='OTHER';document.querySelectorAll('.issue').forEach(x=>x.classList.toggle('active',x.dataset.category==='OTHER'))}}
function chooseIssue(btn){selectedCategory=btn.dataset.category;document.querySelectorAll('.issue').forEach(x=>x.classList.toggle('active',x===btn))}
document.querySelectorAll('.issue').forEach(btn=>btn.addEventListener('click',()=>chooseIssue(btn)));
$('evidenceFile').addEventListener('change',()=>{$('fileName').textContent=$('evidenceFile').files?.[0]?.name||''});

async function loadConfig(){try{const data=await readJson(await fetch('/api/support/config',{cache:'no-store'}));storageEnabled=Boolean(data.storageEnabled);if(!storageEnabled){$('uploadBox').style.display='none'}}catch{$('uploadBox').style.display='none'}}
function readPrefill(){try{const raw=sessionStorage.getItem('ubee_support_prefill');if(raw){const d=JSON.parse(raw);$('sourceRole').value=d.sourceRole||'customer';$('sourceIdentifier').value=d.identifier||'';$('orderId').value=d.orderId||'';$('phone').value=d.contactPhone||'';$('name').value=d.contactName||'';sessionStorage.removeItem('ubee_support_prefill')}}catch{}const p=new URLSearchParams(location.search);if(p.get('orderId'))$('orderId').value=p.get('orderId');if(p.get('sourceRole'))$('sourceRole').value=p.get('sourceRole')}
async function uploadEvidence(caseId,token,file){const headers={'Content-Type':file.type||'application/octet-stream','X-UBee-Support-Case-Id':caseId,'X-UBee-Support-Access-Token':token,'X-UBee-Support-File-Name':encodeURIComponent(file.name),'X-UBee-Support-Evidence-Type':file.type==='application/pdf'?'OTHER':'ITEM_PHOTO'};return readJson(await fetch('/api/support/evidence/upload',{method:'POST',headers,body:await file.arrayBuffer()}))}

async function submitCase(){if(loading)return;const noOrder=$('noOrder').checked;const orderId=$('orderId').value.trim().toUpperCase();const phone=$('phone').value.trim();const description=$('description').value.trim();const category=noOrder?'GENERAL_INQUIRY':selectedCategory;if(!noOrder&&!orderId)return alert('請輸入訂單編號。');if(!phone)return alert('請輸入聯絡電話。');if(!category)return alert('請選擇遇到的問題。');if(!description)return alert('請簡單說明發生什麼事情。');const file=$('evidenceFile').files?.[0];if(file&&file.size>6*1024*1024)return alert('檔案不可超過 6 MB。');loading=true;$('submitBtn').disabled=true;$('submitBtn').textContent='正在送出…';try{const body={sourceRole:$('sourceRole').value||'customer',category,orderId:noOrder?'':orderId,identifier:$('sourceIdentifier').value,sourceName:$('name').value.trim(),contactPhone:phone,title:'',description,requestedResolution:'請 UBee 客服協助確認並回覆。'};const data=await readJson(await fetch('/api/support/cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}));if(file&&storageEnabled)await uploadEvidence(data.caseId,data.accessToken,file);saveCredential({caseId:data.caseId,accessToken:data.accessToken,category,createdAtMs:Date.now()});$('createFormArea').style.display='none';$('successCaseId').textContent=data.caseId;$('successBox').classList.add('show');toast('客服案件已送出')}catch(err){alert('送出失敗：'+err.message)}finally{loading=false;$('submitBtn').disabled=false;$('submitBtn').textContent='送出客服案件'}}
function resetForm(){$('createFormArea').style.display='block';$('successBox').classList.remove('show');$('description').value='';$('evidenceFile').value='';$('fileName').textContent='';selectedCategory='';document.querySelectorAll('.issue').forEach(x=>x.classList.remove('active'));scrollTo({top:0,behavior:'smooth'})}
function openLatestCase(){switchView('cases');const item=getSaved()[0];if(item)loadCase(item.caseId,item.accessToken)}
function renderSavedCases(){const list=getSaved();$('savedCases').innerHTML=list.length?list.map(x=>`<button class="saved-case" onclick="loadCase('${esc(x.caseId)}','${esc(x.accessToken)}')"><b>${esc(x.caseId)}</b><span>${esc(fmtTime(x.createdAtMs))}・點一下查看最新進度</span></button>`).join(''):'<div class="empty">這台裝置還沒有建立過客服案件。</div>'}
function manualLookup(){const caseId=$('manualCaseId').value.trim().toUpperCase(),token=$('manualToken').value.trim();if(!caseId||!token)return alert('請輸入案件編號與查詢憑證。');saveCredential({caseId,accessToken:token,createdAtMs:Date.now()});loadCase(caseId,token)}
async function loadCase(caseId,token){$('caseDetail').innerHTML='<div class="card empty">正在讀取案件進度…</div>';try{const data=await readJson(await fetch(`/api/support/cases/${encodeURIComponent(caseId)}?accessToken=${encodeURIComponent(token)}&t=${Date.now()}`,{cache:'no-store'}));renderCase(data,token)}catch(err){$('caseDetail').innerHTML=`<div class="card empty">讀取失敗：${esc(err.message)}</div>`}}
function renderCase(data,token){const c=data.case||{},events=data.events||[],info=statusInfo(c.status);$('caseDetail').innerHTML=`<div class="status-card"><div class="case">${esc(c.caseId||'')}</div><h2>${esc(info[0])}</h2><p>${esc(info[1])}</p></div><div class="detail-card"><div class="section-title">你的問題</div><div style="font-size:13px;line-height:1.7;color:#555;white-space:pre-line">${esc(c.description||'')}</div>${c.latestPublicReply?`<div class="section-title" style="margin-top:18px">客服最新回覆</div><div style="padding:12px;border-radius:14px;background:#fff8d5;font-size:13px;line-height:1.65;white-space:pre-line">${esc(c.latestPublicReply)}</div>`:''}</div><div class="detail-card"><div class="section-title">處理紀錄</div><div class="timeline">${events.length?events.map(e=>`<div class="event"><div class="dot"></div><div><b>${esc(e.title||'案件更新')}</b><p>${esc(e.message||'')}</p><small>${esc(fmtTime(e.createdAtMs))}</small></div></div>`).join(''):'<div class="empty">目前還沒有新的處理紀錄。</div>'}</div></div><div class="detail-card"><div class="section-title">補充說明</div><textarea id="extraMessage" class="textarea" placeholder="補充新的資訊或回覆客服"></textarea><button class="btn light" style="margin-top:10px" onclick="sendMessage('${esc(c.caseId)}','${esc(token)}')">送出補充說明</button></div>`}
async function sendMessage(caseId,token){const message=$('extraMessage').value.trim();if(!message)return alert('請填寫補充內容。');try{await readJson(await fetch(`/api/support/cases/${encodeURIComponent(caseId)}/messages`,{method:'POST',headers:{'Content-Type':'application/json','X-UBee-Support-Access-Token':token},body:JSON.stringify({message})}));toast('補充說明已送出');loadCase(caseId,token)}catch(err){alert(err.message)}}

(async()=>{await loadConfig();readPrefill();renderSavedCases();const p=new URLSearchParams(location.search);if(p.get('caseId')&&p.get('accessToken')){switchView('cases');loadCase(p.get('caseId'),p.get('accessToken'))}})();
</script>
</body>
</html>
