<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta name="theme-color" content="#ffffff">
  <title>UBee 跑腿｜目前無法連線</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
      background: #f5f6f7;
      color: #111111;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .offline-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      border: 1px solid #e6e7e9;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 16px 42px rgba(17, 24, 39, 0.08);
      text-align: center;
    }

    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 24px;
      object-fit: cover;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      line-height: 1.4;
      font-weight: 900;
    }

    p {
      margin: 0 0 24px;
      color: #6f7378;
      font-size: 15px;
      line-height: 1.8;
      font-weight: 700;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: #facc15;
      color: #111111;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <main class="offline-card">
    <img
      class="icon"
      src="/ubee-customer-icon-192.png"
      alt="UBee 跑腿"
    >

    <h1>目前無法連線</h1>

    <p>
      請確認手機網路或 Wi-Fi 是否正常，恢復連線後再重新載入 UBee 跑腿。
    </p>

    <button type="button" onclick="window.location.reload()">
      重新連線
    </button>
  </main>
</body>
</html>
