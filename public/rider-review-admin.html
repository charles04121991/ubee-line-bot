ay:grid;place-items:center;font-size:28px;font-weight:1000}.login-title{margin-top:16px;font-size:27px;font-weight:1000}.login-copy{margin-top:7px;color:var(--muted);font-size:14px;line-height:1.6}.login-fields{display:grid;gap:11px;margin-top:18px}.toast{position:fixed;right:18px;bottom:90px;z-index:120;max-width:min(420px,calc(100vw - 36px));padding:14px 16px;border-radius:16px;background:#111827;color:#fff;font-size:14px;font-weight:900}.loading{opacity:.62;pointer-events:none}

/* V2.1 Review Workbench: improved desktop readability + compact phone workflow */
:root{--shadow:0 5px 22px rgba(15,23,42,.055)}
body{background:#f5f6f8}
.topbar{min-height:70px;padding:11px 22px;border-bottom:1px solid #e5e7eb}
.brand-mark{border-radius:14px}
.brand-title{letter-spacing:-.35px}
.layout{grid-template-columns:minmax(310px,365px) minmax(0,1fr);min-height:calc(100vh - 70px)}
.sidebar{padding:18px 14px;max-height:calc(100vh - 70px)}
.detail{padding:26px 28px;max-height:calc(100vh - 70px)}
.detail-shell{max-width:1140px;gap:18px}
.hero{background:#fff;border-radius:22px;padding:24px}
.section{border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.hero-title{font-size:29px;letter-spacing:-.7px}
.hero-meta{grid-template-columns:repeat(5,minmax(0,1fr))}
.meta-card{min-width:0}
.meta-value{overflow-wrap:anywhere}
.filter-tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat-card{background:#fff}
.stat-value{font-size:19px}
.application-list{gap:9px}
.application-card{border-radius:15px;transition:border-color .15s,box-shadow .15s,background .15s}
.application-card:hover{border-color:#d1d5db;background:#fffdf5}
.application-card.active{background:#fffdf0}
.queue-tools{display:flex;align-items:center;justify-content:space-between;gap:8px}
.small-select{width:142px;padding:7px 9px;min-height:36px;border-radius:10px;font-size:12px}
.detail-tabbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:5px;overflow-x:auto;padding:9px;background:#f5f6f8;border-bottom:1px solid #e5e7eb;scrollbar-width:thin}
.detail-tab{border:0;border-radius:12px;flex:0 0 auto;padding:10px 15px;min-height:41px;background:transparent;color:#475569;font-size:13px;font-weight:900}
.detail-tab.active{color:#111827;background:#facc15}
.detail-pane{display:none;gap:16px}
.detail-pane.active{display:grid}
.readiness{border-radius:17px;padding:15px 17px;background:#fff;border:1px solid #e5e7eb}
.readiness.good{border-left:5px solid #16a34a}
.readiness.caution{border-left:5px solid #f59e0b}
.readiness.blocked{border-left:5px solid #dc2626}
.readiness-title{font-weight:1000;font-size:15px}
.readiness-copy{margin-top:6px;font-size:13px;line-height:1.65;color:#475569;font-weight:750}
.workflow-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.workflow-step{padding:8px 11px;border-radius:999px;font-weight:850;font-size:12px;border:1px solid #e5e7eb;background:#f8fafc}
.workflow-step.done{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
.workflow-step.block{border-color:#fed7aa;background:#fff7ed;color:#9a3412}
.hero-navigation{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn.small{min-height:38px;padding:8px 11px;border-radius:11px;font-size:12px}
.section-hint{font-size:12px;color:#64748b;line-height:1.65;margin-top:6px}
.quick-approve-area{border:1px dashed #f59e0b;border-radius:17px;padding:15px;background:#fffbeb;margin-top:15px}
.sticky-actions{left:365px;padding:12px 26px calc(12px + env(safe-area-inset-bottom))}
.sticky-inner{grid-template-columns:1fr auto auto;gap:9px}
.sticky-note{max-width:470px;line-height:1.5}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.sidebar{max-height:none;border-right:0;border-bottom:1px solid var(--line)}.detail{max-height:none}.application-list{grid-template-columns:repeat(2,minmax(0,1fr))}.sticky-actions{left:0}.detail-tabbar{top:0}}
@media(max-width:740px){.topbar{padding:10px 12px}.brand-title{font-size:16px}.brand-subtitle,.operator-pill{display:none}.application-list{grid-template-columns:1fr}.detail{padding:12px}.detail-tabbar{margin:0 -12px;padding:7px 12px}.detail-tab{padding:9px 12px}.hero{padding:17px}.hero-title{font-size:24px}.hero-meta{grid-template-columns:repeat(2,minmax(0,1fr))}.info-grid,.verification-summary,.documents,.batch-grid{grid-template-columns:1fr}.sticky-actions{padding:9px 12px calc(9px + env(safe-area-inset-bottom))}.sticky-inner{grid-template-columns:repeat(2,minmax(0,1fr))}.sticky-note{grid-column:1/-1}.sticky-inner .btn{min-height:42px;font-size:12px;padding:8px}.hero-navigation{margin-top:8px}.batch-reason-fields{grid-template-columns:1fr!important}}
@media(min-width:741px) and (max-width:1100px){.hero-meta{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="brand-mark">U</div><div><div class="brand-title">UBee 小U審核工作台 V2.2</div><div class="brand-subtitle">Review Workbench・大頭照／五份證件逐項審核</div></div></div><div class="top-actions"><div class="operator-pill" id="operatorPill">尚未登入</div><button class="btn ghost" id="refreshButton" onclick="loadApplications()">重新整理</button><button class="btn ghost" onclick="logoutAdmin()">登出</button></div></header>
<main class="layout" id="mainLayout"><aside class="sidebar"><div class="sidebar-head"><div class="search-row"><input class="input" id="searchInput" placeholder="搜尋姓名、手機、地區或車牌" onkeydown="handleSearchKey(event)"><button class="btn primary" onclick="loadApplications()">搜尋</button></div><div class="stats-grid" id="statsGrid"></div><div class="filter-tabs"><button class="filter-tab active" onclick="setStatusFilter('all',this)">全部</button><button class="filter-tab" onclick="setStatusFilter('pending',this)">待審核</button><button class="filter-tab" onclick="setStatusFilter('needs_supplement',this)">待補件</button><button class="filter-tab" onclick="setStatusFilter('approved',this)">已通過</button><button class="filter-tab" onclick="setStatusFilter('rejected',this)">已拒絕</button><button class="filter-tab" onclick="setLocalRiskFilter(this)">有風險</button></div><div class="queue-tools"><div class="count-line" id="countLine">尚未載入申請資料</div><select id="sortSelect" class="select small-select" onchange="renderApplicationList()" aria-label="申請排序"><option value="updated_desc">最近更新</option><option value="submitted_asc">最早申請優先</option><option value="risk_desc">風險優先</option><option value="name_asc">姓名排序</option></select></div></div><div class="application-list" id="applicationList"></div></aside><section class="detail" id="detailPanel"><div class="empty-state"><div><div class="empty-icon">📋</div><div style="font-size:22px;font-weight:1000;color:#111827">選擇左側申請，開始審核</div><div style="margin-top:8px;line-height:1.65;font-weight:700">使用分頁工作台完成資料核對、三大驗證、補件與最終決定。</div></div></div></section></main>
<div class="login-overlay" id="loginOverlay"><form class="login-card" onsubmit="loginAdmin(event)"><div class="login-mark">U</div><div class="login-title">進入小U審核管理</div><div class="login-copy">請使用管理授權密碼登入。授權碼僅在目前分頁的工作階段保留；結束審核後請登出。</div><div class="login-fields"><input class="input" id="adminKeyInput" type="password" autocomplete="current-password" placeholder="管理密碼" required><input class="input" id="operatorInput" autocomplete="name" placeholder="審核人員名稱，例如 Charles" required><button class="btn primary" id="loginButton" type="submit">登入審核管理</button></div><div id="loginMessage"></div></form></div><div class="toast hidden" id="toast"></div>
<script>
const API_BASE=location.protocol.startsWith('http')?location.origin:'https://ubee-line-bot-2-zezw.onrender.com';
const STORAGE_KEY='ubee_rider_review_admin_key',OPERATOR_KEY='ubee_rider_review_operator';
const STATUS_LABELS={submitted:'已送出',pending:'待審核',under_review:'審核中',needs_supplement:'待補件',approved:'已通過',training:'數位入職',active:'已開通',rejected:'已拒絕'};
const DOCUMENT_STATUS_LABELS={pending:'審核中',approved:'已通過',needs_supplement:'需要補件',missing:'缺少照片',not_required:'不適用'};
const GROUP_STATUS_LABELS={pending:'審核中',approved:'已通過',needs_supplement:'需要補件',not_required:'不適用'};
const EVENT_LABELS={mark_profile_photo:'大頭照審核',mark_document:'更新文件狀態',approve_group:'整組驗證通過',request_supplement:'要求補件',approve_all:'確認所有驗證並通過',approve:'通過申請',credential_maintenance_approved:'證件複審完成並恢復資格',reject:'拒絕申請',reopen:'重新開啟',save_review_note:'儲存審核備註',supplement_submitted:'申請者已補件'};
const SUPPLEMENT_REASONS=['照片模糊','證件反光','證件四角不完整','資料與申請內容不符','證件已過期','強制險已過期','車牌資料不一致','需要重新拍攝','其他原因'];
let adminKey=sessionStorage.getItem(STORAGE_KEY)||'',operatorName=localStorage.getItem(OPERATOR_KEY)||'',statusFilter='all',localRiskOnly=false,applications=[],selectedRiderId='',selectedApplication=null,detailTabActive='overview';
// 移除 V2 留在瀏覽器長期儲存區的管理授權碼；不再寫入 localStorage。
localStorage.removeItem(STORAGE_KEY);
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function formatDateTime(v){const ms=Number(v||0);if(!ms)return'尚未記錄';try{return new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ms));}catch(_){return new Date(ms).toLocaleString('zh-TW');}}
function safePreviewUrl(v){try{const u=new URL(String(v||''),location.origin);return ['https:','http:'].includes(u.protocol)?u.href:'';}catch(_){return '';}}
function getAdminHeaders(json=false){const h={'X-UBee-Admin-Key':adminKey};if(json)h['Content-Type']='application/json';return h;}
async function apiFetch(path,options={}){const response=await fetch(`${API_BASE}${path}`,{cache:'no-store',...options,headers:{...getAdminHeaders(Boolean(options.body)),...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok||data.success===false){const e=new Error(data.message||`HTTP ${response.status}`);e.status=response.status;throw e;}return data;}
function setLoading(v){document.getElementById('mainLayout')?.classList.toggle('loading',v);document.getElementById('refreshButton').disabled=v;}function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.add('hidden'),3500);}function showLoginMessage(m,type='error'){document.getElementById('loginMessage').innerHTML=m?`<div class="message ${escapeHtml(type)}" style="margin-top:12px">${escapeHtml(m)}</div>`:'';}
async function loginAdmin(event){event?.preventDefault();const key=String(adminKeyInput.value||'').trim(),operator=String(operatorInput.value||'').trim();if(!key||!operator)return;loginButton.disabled=true;loginButton.textContent='驗證中...';adminKey=key;operatorName=operator;try{await apiFetch('/api/admin/rider-review/applications?status=all');sessionStorage.setItem(STORAGE_KEY,adminKey);localStorage.setItem(OPERATOR_KEY,operatorName);loginOverlay.classList.add('hidden');operatorPill.textContent=`審核人員：${operatorName}`;await loadApplications();const riderId=new URLSearchParams(location.search).get('riderId');if(riderId)await openApplication(riderId);}catch(e){adminKey='';sessionStorage.removeItem(STORAGE_KEY);showLoginMessage(e.message||'管理密碼驗證失敗。');}finally{loginButton.disabled=false;loginButton.textContent='登入審核管理';}}
function logoutAdmin(){sessionStorage.removeItem(STORAGE_KEY);adminKey='';selectedRiderId='';selectedApplication=null;loginOverlay.classList.remove('hidden');adminKeyInput.value='';operatorInput.value=operatorName;operatorPill.textContent='尚未登入';}
function setStatusFilter(status,button){statusFilter=status;localRiskOnly=false;document.querySelectorAll('.filter-tab').forEach(x=>x.classList.toggle('active',x===button));loadApplications();}function setLocalRiskFilter(button){localRiskOnly=true;statusFilter='all';document.querySelectorAll('.filter-tab').forEach(x=>x.classList.toggle('active',x===button));renderApplicationList();}function handleSearchKey(event){if(event.key==='Enter')loadApplications();}
function getApplicationStatus(item){const lifecycle=String(item.lifecycleStatus||'').toLowerCase(),status=String(item.status||item.reviewStatus||'submitted').toLowerCase();if(lifecycle==='rejected'||status==='rejected')return'rejected';if(status==='needs_supplement'||Number(item.documentSummary?.supplementCount||0)>0)return'needs_supplement';if(lifecycle==='active')return'active';if(lifecycle==='training')return'training';return status;}
function renderStats(stats={}){const items=[['待審核',stats.pending||0],['待補件',stats.needsSupplement||0],['已通過',stats.approved||0],['已拒絕',stats.rejected||0],['有風險',stats.riskApplications||0],['全部',stats.total||0]];statsGrid.innerHTML=items.map(([label,value])=>`<div class="stat-card"><div class="stat-label">${escapeHtml(label)}</div><div class="stat-value">${Number(value||0)}</div></div>`).join('');}
async function loadApplications(){if(!adminKey)return;const q=String(searchInput.value||'').trim();setLoading(true);try{const params=new URLSearchParams({status:statusFilter,q,t:String(Date.now())});const data=await apiFetch(`/api/admin/rider-review/applications?${params}`);applications=Array.isArray(data.applications)?data.applications:[];renderStats(data.stats||{});renderApplicationList();countLine.textContent=`共 ${localRiskOnly?applications.filter(x=>Number(x.riskCount||0)>0).length:applications.length} 筆申請`;}catch(e){if(e.status===401){logoutAdmin();showLoginMessage('管理密碼已失效，請重新登入。');return;}applicationList.innerHTML=`<div class="message error">${escapeHtml(e.message||'讀取申請失敗')}</div>`;}finally{setLoading(false);}}
function renderApplicationList(){
  const rows=(localRiskOnly?applications.filter(x=>Number(x.riskCount||0)>0):applications).slice();
  const sort=String(document.getElementById('sortSelect')?.value||'updated_desc');
  rows.sort((a,b)=>{
    if(sort==='submitted_asc')return Number(a.submittedAtMs||0)-Number(b.submittedAtMs||0);
    if(sort==='risk_desc')return Number(b.criticalRiskCount||0)-Number(a.criticalRiskCount||0)||Number(b.riskCount||0)-Number(a.riskCount||0);
    if(sort==='name_asc')return String(a.name||'').localeCompare(String(b.name||''),'zh-TW');
    return Number(b.updatedAtMs||b.submittedAtMs||0)-Number(a.updatedAtMs||a.submittedAtMs||0);
  });
  countLine.textContent=`目前顯示 ${rows.length} 筆申請`;
  if(!rows.length){applicationList.innerHTML='<div class="message warning">目前沒有符合條件的申請。</div>';return;}
  applicationList.innerHTML=rows.map(item=>{
    const status=getApplicationStatus(item),groups=Array.isArray(item.verificationGroups)?item.verificationGroups.filter(g=>g.required):[];
    const critical=Number(item.criticalRiskCount||0),risk=Number(item.riskCount||0);
    return `<button class="application-card ${selectedRiderId===item.riderId?'active':''}" data-rider-id="${escapeHtml(item.riderId)}" onclick="openApplication(this.dataset.riderId)">
      <div class="card-head"><div><div class="card-name">${escapeHtml(item.name||'未命名申請')}</div><div class="card-id">${escapeHtml(item.phone||item.riderId)}</div></div><span class="status-pill ${escapeHtml(status)}">${escapeHtml(STATUS_LABELS[status]||status)}</span></div>
      <div class="card-copy"><div>${escapeHtml(item.district||'居住地區未填')}・${escapeHtml(item.vehicle||'-')}</div><div>${escapeHtml(item.plateNumber||'無車牌')}・驗證 ${Number(item.documentSummary?.approvedGroupCount||0)}／${Number(item.documentSummary?.requiredGroupCount||groups.length)} 組</div><div>${escapeHtml(formatDateTime(item.updatedAtMs||item.submittedAtMs))}${risk?`・<span class="risk-badge">${critical?'⛔ '+critical+' 項重大風險':risk+' 項提醒'}</span>`:''}</div></div>
      <div class="group-mini">${groups.map(g=>`<span class="${escapeHtml(g.status)}">${escapeHtml(g.label)}・${escapeHtml(GROUP_STATUS_LABELS[g.status]||g.status)}</span>`).join('')}</div></button>`;
  }).join('');
}
async function openApplication(riderId){if(!riderId)return;if(selectedRiderId!==riderId)detailTabActive='overview';selectedRiderId=riderId;renderApplicationList();detailPanel.innerHTML='<div class="empty-state"><div><div class="empty-icon">⏳</div><div style="font-size:20px;font-weight:1000">正在載入申請明細</div></div></div>';try{const data=await apiFetch(`/api/admin/rider-review/applications/${encodeURIComponent(riderId)}?t=${Date.now()}`);selectedApplication=data.application;renderApplicationDetail(selectedApplication);const url=new URL(location.href);url.searchParams.set('riderId',riderId);history.replaceState(null,'',url);}catch(e){detailPanel.innerHTML=`<div class="message error">${escapeHtml(e.message||'讀取申請明細失敗')}</div>`;}}
function infoItem(label,value){return `<div class="info-item"><div class="meta-label">${escapeHtml(label)}</div><div class="meta-value">${escapeHtml(value||'-')}</div></div>`;}
function renderVerificationSummary(groups=[]){return `<div class="verification-summary">${groups.map(group=>`<div class="verification-summary-card ${escapeHtml(group.status||'pending')}"><div class="section-title-row"><div><div class="verification-name">${escapeHtml(group.label)}</div><div class="verification-copy">${escapeHtml(group.description||'')}</div></div><span class="status-pill ${escapeHtml(group.status||'pending')}">${escapeHtml(GROUP_STATUS_LABELS[group.status]||group.status)}</span></div><div class="verification-count">${group.required?`${Number(group.approvedCount||0)}／${Number(group.totalCount||0)} 項通過`:'此配送工具不需要'}</div></div>`).join('')}</div>`;}
function renderDocumentCard(item,isFinal,isRejected){const status=String(item.reviewStatus||'pending'),reviewDisabled=isFinal||isRejected,preview=safePreviewUrl(item.previewUrl)?`<img src="${escapeHtml(safePreviewUrl(item.previewUrl))}" alt="${escapeHtml(item.label)}">`:`<div class="document-preview-copy">找不到預覽檔案。</div>`;return `<article class="document-card"><div class="document-preview">${preview}</div><div class="document-content"><div class="document-title-row"><div><div class="document-title">${escapeHtml(item.label)}</div><div class="document-file">${escapeHtml(item.originalName||'檔名未記錄')}・${Math.max(0,Math.round(Number(item.sizeBytes||0)/1024))} KB</div></div><span class="status-pill ${escapeHtml(status)}">${escapeHtml(DOCUMENT_STATUS_LABELS[status]||status)}</span></div>${item.reviewReason?`<div class="reason-box">補件原因：${escapeHtml(item.reviewReason)}</div>`:''}<div class="document-actions"><button class="view-btn" ${safePreviewUrl(item.previewUrl)?'':'disabled'} data-url="${escapeHtml(safePreviewUrl(item.previewUrl))}" onclick="openDocumentPreview(this.dataset.url)">開啟原檔</button><button class="approve-btn" ${reviewDisabled?'disabled':''} data-key="${escapeHtml(item.documentKey)}" onclick="markDocument(this.dataset.key,'approved')">標記通過</button><button class="supplement-btn" ${isFinal||isRejected?'disabled':''} data-key="${escapeHtml(item.documentKey)}" onclick="requestSingleSupplement(this.dataset.key,'${escapeHtml(item.label)}')">要求補件</button><button class="reset-btn" ${reviewDisabled?'disabled':''} data-key="${escapeHtml(item.documentKey)}" onclick="markDocument(this.dataset.key,'pending')">恢復待審核</button></div></div></article>`;}
function renderVerificationGroups(application,isFinal,isRejected){const groups=Array.isArray(application.verificationGroups)?application.verificationGroups:[],documents=Array.isArray(application.documents)?application.documents:[];return groups.map(group=>{if(!group.required)return'';const docs=documents.filter(d=>d.groupKey===group.key);return `<div class="verification-group"><div class="verification-group-head"><div><div class="verification-group-title">${escapeHtml(group.label)}</div><div class="verification-group-copy">${escapeHtml(group.description||'')}</div></div><div style="display:flex;gap:8px;align-items:center"><span class="status-pill ${escapeHtml(group.status)}">${escapeHtml(GROUP_STATUS_LABELS[group.status]||group.status)}</span></div></div><div class="documents">${docs.map(d=>renderDocumentCard(d,isFinal,isRejected)).join('')}</div></div>`;}).join('');}
function renderRiskChecks(risk={}){const items=Array.isArray(risk.items)?risk.items:[];if(!items.length)return'<div class="message success" style="margin-top:14px">目前沒有系統偵測到的高風險項目。</div>';return `<div class="risk-list">${items.map(item=>`<div class="risk-item ${escapeHtml(item.level)}"><div class="risk-title">${item.level==='critical'?'⛔':'⚠️'} ${escapeHtml(item.label)}</div><div class="risk-detail">${escapeHtml(item.detail||'')}</div></div>`).join('')}</div>`;}
function renderHistory(events=[]){if(!events.length)return'<div class="message success" style="margin-top:14px">尚無審核操作紀錄。</div>';return `<div class="history-list">${events.map(event=>`<div class="history-item"><div class="history-title">${escapeHtml(EVENT_LABELS[event.type]||event.type||'狀態更新')}・${escapeHtml(event.operator||'system')}</div><div class="history-copy">${escapeHtml(formatDateTime(event.createdAtMs))}${event.reason?`<br>${escapeHtml(event.reason)}`:''}</div></div>`).join('')}</div>`;}
function renderNotifications(items=[]){if(!items.length)return'<div class="message warning" style="margin-top:14px">尚未建立申請通知紀錄。</div>';return `<div class="notification-list">${items.map(item=>`<div class="notification-item"><div class="notification-title">${escapeHtml(item.title||'申請狀態更新')}</div><div class="notification-copy">${escapeHtml(formatDateTime(item.createdAtMs))}<br>${escapeHtml(item.body||'')}</div></div>`).join('')}</div>`;}
function renderBatchSupplement(application,isRejected){const documents=[...(application.profilePhotoRequired===true?[{documentKey:'profilePhoto',label:'小U大頭照',reviewReason:application.profilePhotoReview?.reviewReason||''}]:[]),...(Array.isArray(application.documents)?application.documents:[])],reasonOptions=SUPPLEMENT_REASONS.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');return `<section class="section"><div class="section-title">批次要求補件</div><div class="section-copy">可一次勾選多份資料並統一發送。</div><div class="batch-grid">${documents.map(d=>`<div class="batch-item"><input type="checkbox" class="batchSupplementDocument" id="batchDoc_${escapeHtml(d.documentKey)}" value="${escapeHtml(d.documentKey)}"><label for="batchDoc_${escapeHtml(d.documentKey)}">${escapeHtml(d.label)}<small>${d.reviewReason?`目前原因：${escapeHtml(d.reviewReason)}`:'尚未設定補件原因'}</small></label></div>`).join('')}</div><div class="batch-reason-fields" style="display:grid;grid-template-columns:220px 1fr;gap:9px;margin-top:11px"><select class="select" id="batchReasonPreset"><option value="">選擇常用原因</option>${reasonOptions}</select><input class="input" id="batchReasonCustom" placeholder="可補充更具體的說明"></div><div class="batch-actions"><button class="btn ghost" onclick="selectAllBatchSupplement()">全選可補件項目</button><button class="btn orange" ${isRejected?'disabled':''} onclick="requestBatchSupplement()">送出補件要求</button></div></section>`;}
function renderProfilePhoto(application,isFinal=false,isRejected=false){
  const p=application.profilePhoto||{},review=application.profilePhotoReview||{};
  if(application.profilePhotoRequired!==true&&!p.storagePath)return '';
  const status=String(review.reviewStatus||'pending'),fileReady=Boolean(review.hasFile||p.storagePath);
  const statusLabel=DOCUMENT_STATUS_LABELS[status]||status;
  const url=safePreviewUrl(p.previewUrl),editable=!isFinal&&!isRejected&&application.credentialMaintenanceActive!==true;
  const preview=url?`<img class="profile-photo" style="width:200px;height:200px;object-fit:contain;border-radius:18px" src="${escapeHtml(url)}" alt="小U大頭照">`:'<div class="document-preview-copy">照片無法預覽或尚未上傳</div>';
  return `<section class="section"><div class="section-title-row"><div><div class="section-title">小U大頭照・獨立審核</div><div class="section-copy">第 6 項審核資料。大頭照不計入原本的三大驗證／五份證件統計，但必須人工通過才能核准申請。</div></div><span class="status-pill ${escapeHtml(status)}">${escapeHtml(statusLabel)}</span></div>
    <div class="profile-photo-wrap">${preview}<div><div class="document-file">${escapeHtml(p.originalName||'未提供檔案')}・${Math.max(0,Math.round(Number(p.sizeBytes||0)/1024))} KB</div>
    ${review.reviewReason?`<div class="reason-box">補件原因：${escapeHtml(review.reviewReason)}</div>`:''}
    ${review.reviewedBy?`<div class="section-hint">審核人員：${escapeHtml(review.reviewedBy)}・${escapeHtml(formatDateTime(review.reviewedAtMs))}</div>`:''}
    <div class="document-actions" style="max-width:420px;margin-top:14px"><button class="view-btn" ${url?'':'disabled'} data-url="${escapeHtml(url)}" onclick="openDocumentPreview(this.dataset.url)">檢視原圖</button>
    <button class="approve-btn" ${editable&&fileReady?'':'disabled'} onclick="markProfilePhoto('approved')">審核通過</button>
    <button class="supplement-btn" ${editable?'':'disabled'} onclick="requestSingleSupplement('profilePhoto','小U大頭照')">要求補件</button>
    <button class="reset-btn" ${editable&&fileReady?'':'disabled'} onclick="markProfilePhoto('pending')">恢復待審</button></div></div></div></section>`;
}
function showDetailTab(tab){
  const allowed=['overview','documents','risks','supplement','history'];
  detailTabActive=allowed.includes(tab)?tab:'overview';
  document.querySelectorAll('[data-detail-tab]').forEach(el=>el.classList.toggle('active',el.dataset.detailTab===detailTabActive));
  document.querySelectorAll('[data-tab-button]').forEach(el=>{const active=el.dataset.tabButton===detailTabActive;el.classList.toggle('active',active);el.setAttribute('aria-selected',active?'true':'false');});
  const panel=document.getElementById('detailPanel');if(panel && window.innerWidth<=1100)panel.scrollIntoView({behavior:'smooth',block:'start'});
}
function navigateApplication(direction){
  const ids=[...document.querySelectorAll('.application-card')].map(x=>x.dataset.riderId).filter(Boolean);
  const index=ids.indexOf(selectedRiderId);if(index<0)return;
  const next=ids[index+direction];if(next)openApplication(next);
}
function renderApplicationDetail(application){
  const status=getApplicationStatus(application),statusLabel=STATUS_LABELS[status]||status;
  const isFinal=(['training','approved','active'].includes(String(application.status||'').toLowerCase())||['TRAINING','ACTIVE'].includes(String(application.lifecycleStatus||'').toUpperCase()))&&application.credentialMaintenanceActive!==true;
  const isRejected=String(application.status||'').toLowerCase()==='rejected';
  const isMaintenance=application.credentialMaintenanceActive===true;
  const emergency=application.emergencyContact||{},groups=(application.verificationGroups||[]).filter(g=>g.required);
  const allApproved=application.documentSummary?.allApproved===true;
  const critical=Number(application.riskChecks?.criticalCount||0),warning=Number(application.riskChecks?.warningCount||0);
  const photoReview=application.profilePhotoReview||{};
  const photoReady=application.profilePhotoRequired!==true||photoReview.reviewStatus==='approved';
  const photoPresent=application.profilePhotoRequired!==true||Boolean(application.profilePhoto?.storagePath);
  const missing=Array.isArray(application.documents)?application.documents.filter(x=>x.reviewStatus!=='approved').map(x=>x.label):[];
  const canApprove=allApproved&&critical===0&&photoReady&&!isFinal&&!isRejected;
  const checks=[{label:'大頭照人工審核',done:photoReady},{label:'必要文件驗證',done:allApproved},{label:'重大風險檢查',done:critical===0},{label:'入職接單資格',done:application.canAcceptOrders===true}];
  const readinessLevel=!photoReady||critical>0?'blocked':canApprove?'good':'caution';
  const readinessTitle=isFinal?'申請已通過，請依正式資格鏈管理':isRejected?'申請已拒絕，可依規範重新開啟':!photoReady?(photoPresent?'大頭照尚未通過人工審核':'缺少必要大頭照'):critical>0?'重大風險尚未排除':canApprove?'具備申請審核通過條件':'尚有文件等待審核';
  const readinessCopy=isFinal?'已建立或維持既有入職流程；是否可接單仍以伺服器資格判定為準。':isRejected?'若需重新審核，請在下方使用重新開啟操作。':!photoReady?(photoPresent?'請先在文件驗證頁審核大頭照。':'申請大頭照尚未上傳，不可通過。'):critical>0?'請先處理風險分頁的重大項目，系統將阻擋正式通過。':canApprove?'所有必要文件已標記通過且目前無重大風險，可進行最終審核。':`尚有 ${missing.length} 份必要文件未通過，請逐份確認或發出補件要求。`;
  detailPanel.innerHTML=`<div class="detail-shell">
    <section class="hero"><div class="hero-top"><div><span class="status-pill ${escapeHtml(status)}">${escapeHtml(statusLabel)}</span><div class="hero-title" style="margin-top:10px">${escapeHtml(application.name||'未命名申請')}</div><div class="hero-copy">申請編號：${escapeHtml(application.riderId||application.id)}・手機：${escapeHtml(application.phone||'-')}・${escapeHtml(application.vehicle||'-')}</div></div><div class="hero-navigation"><button class="btn ghost small" onclick="navigateApplication(-1)">上一筆</button><button class="btn ghost small" onclick="navigateApplication(1)">下一筆</button><button class="btn ghost small" data-rider-id="${escapeHtml(application.riderId)}" onclick="openApplication(this.dataset.riderId)">更新明細</button></div></div>
    <div class="hero-meta"><div class="meta-card"><div class="meta-label">已通過驗證</div><div class="meta-value">${Number(application.documentSummary?.approvedGroupCount||0)}／${Number(application.documentSummary?.requiredGroupCount||groups.length)} 組</div></div><div class="meta-card"><div class="meta-label">大頭照</div><div class="meta-value">${photoReady?'審核通過':photoPresent?'待人工審核':'尚未上傳'}</div></div><div class="meta-card"><div class="meta-label">申請時間</div><div class="meta-value">${escapeHtml(formatDateTime(application.submittedAtMs))}</div></div><div class="meta-card"><div class="meta-label">風險項目</div><div class="meta-value">${critical} 重大・${warning} 提醒</div></div><div class="meta-card"><div class="meta-label">接單資格</div><div class="meta-value">${application.canAcceptOrders?'已開通':isMaintenance?'補件複審中・暫停':'尚未開通'}</div></div></div></section>
    <div class="readiness ${readinessLevel}"><div class="readiness-title">${escapeHtml(readinessTitle)}</div><div class="readiness-copy">${escapeHtml(readinessCopy)}</div><div class="workflow-line">${checks.map(x=>`<span class="workflow-step ${x.done?'done':'block'}">${x.done?'✓':'·'} ${escapeHtml(x.label)}</span>`).join('')}</div></div>
    <nav class="detail-tabbar" aria-label="審核內容分頁">${[['overview','總覽與資料'],['documents','文件驗證'],['risks','風險檢查'],['supplement','批次補件'],['history','紀錄與決定']].map(([key,label])=>`<button class="detail-tab" data-tab-button="${key}" role="tab" onclick="showDetailTab('${key}')">${label}${key==='risks'&&critical?` (${critical})`:''}</button>`).join('')}</nav>
    <div class="detail-pane" data-detail-tab="overview">
      ${renderProfilePhoto(application,isFinal,isRejected)}
      ${application.supplementReason?`<div class="message warning">目前補件要求：${escapeHtml(application.supplementReason)}</div>`:''}
      ${application.rejectionReason?`<div class="message error">拒絕原因：${escapeHtml(application.rejectionReason)}</div>`:''}
      <section class="section"><div class="section-title">三大驗證進度</div>${renderVerificationSummary(application.verificationGroups||[])}</section>
      <section class="section"><div class="section-title">申請基本資料</div><div class="info-grid">${infoItem('姓名',application.name)}${infoItem('手機',application.phone)}${infoItem('LINE ID（選填）',application.lineId||'未提供')}${infoItem('出生年月日',application.birthDate)}${infoItem('居住地區',application.district)}${infoItem('配送工具',application.vehicle)}${infoItem('車牌號碼',application.plateNumber||'不適用')}${infoItem('車輛所有權',application.vehicleOwnerType==='other'?'他人車輛・已記錄同意':'本人車輛')}${infoItem('強制險到期',application.compulsoryInsuranceExpiryDate||'不適用')}${infoItem('服務區域',application.serviceArea)}${infoItem('可服務時段',application.availableTime)}${infoItem('緊急聯絡人',`${emergency.name||'-'}・${emergency.relationship||'-'}・${emergency.phone||'-'}`)}</div></section>
    </div>
    <div class="detail-pane" data-detail-tab="documents">
      ${renderProfilePhoto(application,isFinal,isRejected)}
      <section class="section"><div class="section-title">三大驗證／五份文件</div><div class="section-hint">每張證件必須獨立審核通過；已停用「通過整組」及「快速全數通過」，避免略過人工查驗。</div>${renderVerificationGroups(application,isFinal,isRejected)}</section>
    </div>
    <div class="detail-pane" data-detail-tab="risks">
      <section class="section"><div class="section-title">系統風險檢查</div><div class="section-hint">系統風險檢查僅是輔助判斷，不能替代人工查驗。重大風險需排除後才能完成審核。</div>${renderRiskChecks(application.riskChecks)}</section>
    </div>
    <div class="detail-pane" data-detail-tab="supplement">${renderBatchSupplement(application,isRejected)}</div>
    <div class="detail-pane" data-detail-tab="history">
      <section class="section"><div class="section-title">內部審核備註</div><textarea class="textarea" id="internalReviewNote" style="margin-top:12px" placeholder="僅供管理端備註">${escapeHtml(application.internalReviewNote||'')}</textarea><button class="btn blue" style="margin-top:10px" onclick="saveReviewNote()">儲存審核備註</button></section>
      <section class="section"><div class="section-title">審核操作紀錄</div>${renderHistory(application.reviewEvents||[])}</section>
      <section class="section"><div class="section-title">申請者通知紀錄</div>${renderNotifications(application.notifications||[])}</section>
      <section class="section"><div class="section-title">最終審核說明</div><div class="section-hint">拒絕申請時必須填寫原因；通過時可以補充審核說明。</div><textarea class="textarea" id="overallReason" style="margin-top:12px" placeholder="拒絕原因（必填）或最終審核備註"></textarea></section>
    </div>
  </div><div class="sticky-actions"><div class="sticky-inner"><div class="sticky-note">${escapeHtml(readinessTitle)}。正式接單仍需符合入職與資格規則。</div>${isRejected?`<button class="btn primary" onclick="performOverallAction('reopen')">重新開啟</button>`:`<button class="btn danger" ${isFinal?'disabled':''} onclick="performOverallAction('reject')">拒絕申請</button><button class="btn success" ${canApprove?'':'disabled'} onclick="performOverallAction('approve')">${isMaintenance?'複審通過／恢復資格':'通過並進入數位入職'}</button>`}</div></div>`;
  // All tab content remains in the DOM; switching tabs will not discard partially edited text.
  const activeTab=detailTabActive;detailTabActive='overview';
  if(activeTab!=='overview' && document.querySelector(`[data-detail-tab="${activeTab}"]`)){
    document.querySelectorAll('[data-detail-tab]').forEach(el=>el.classList.toggle('active',el.dataset.detailTab===activeTab));
    document.querySelectorAll('[data-tab-button]').forEach(el=>{let on=el.dataset.tabButton===activeTab;el.classList.toggle('active',on);el.setAttribute('aria-selected',on?'true':'false');});
    detailTabActive=activeTab;
  }else{
    document.querySelector('[data-detail-tab="overview"]')?.classList.add('active');
    document.querySelector('[data-tab-button="overview"]')?.classList.add('active');
    document.querySelector('[data-tab-button="overview"]')?.setAttribute('aria-selected','true');
  }
}

function openDocumentPreview(url){url=safePreviewUrl(url);if(!url){showToast('目前沒有可開啟的文件。');return;}window.open(url,'_blank','noopener,noreferrer');}
async function postAction(payload){if(!selectedRiderId)throw new Error('尚未選擇申請資料。');return apiFetch(`/api/admin/rider-review/applications/${encodeURIComponent(selectedRiderId)}/action`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operator:operatorName,...payload})});}
async function refreshAfterAction(data,msg){selectedApplication=data.application;renderApplicationDetail(selectedApplication);await loadApplications();showToast(data.message||msg);}
async function markProfilePhoto(documentStatus){
  if(!confirm(documentStatus==='approved'?'確定已人工核對小U大頭照，標記為通過？':'確定將大頭照恢復為待審核？'))return;
  setLoading(true);
  try{await refreshAfterAction(await postAction({action:'mark_profile_photo',documentStatus}),'大頭照審核狀態已更新。');}
  catch(e){alert(e.message||'大頭照審核失敗。');}finally{setLoading(false);}
}
async function requestSingleSupplement(documentKey,label){
  const reason=prompt(`請輸入「${label}」的補件原因（此內容會通知申請者）：`,'照片模糊，請重新拍攝');
  if(reason===null)return;
  if(!String(reason).trim())return alert('請輸入補件原因。');
  if(!confirm(`確定要求補交「${label}」？`))return;
  setLoading(true);
  try{await refreshAfterAction(await postAction({action:'request_supplement',documents:{[documentKey]:String(reason).trim()},reason:String(reason).trim()}),'補件要求已送出。');}
  catch(e){alert(e.message||'補件要求失敗。');}finally{setLoading(false);}
}
async function markDocument(documentKey,documentStatus){if(!confirm(documentStatus==='approved'?'確定將這份資料標記為通過？':'確定恢復為待審核？'))return;setLoading(true);try{await refreshAfterAction(await postAction({action:'mark_document',documentKey,documentStatus,reason:''}),'文件狀態已更新。');}catch(e){alert(e.message||'文件審核失敗。');}finally{setLoading(false);}}
function selectDocumentForSupplement(key){const box=document.getElementById(`batchDoc_${key}`);if(box){box.checked=true;box.scrollIntoView({behavior:'smooth',block:'center'});showToast('已加入批次補件清單。');}}function selectAllBatchSupplement(){document.querySelectorAll('.batchSupplementDocument').forEach(x=>x.checked=true);}
async function requestBatchSupplement(){const keys=[...document.querySelectorAll('.batchSupplementDocument:checked')].map(x=>x.value),preset=String(batchReasonPreset?.value||'').trim(),custom=String(batchReasonCustom?.value||'').trim(),reason=[preset,custom].filter(Boolean).join('：');if(!keys.length)return alert('請至少選擇一份需要補件的資料。');if(!reason)return alert('請選擇或輸入補件原因。');const documents=Object.fromEntries(keys.map(key=>[key,reason]));if(!confirm(`確定要求補件？\n\n原因：${reason}`))return;setLoading(true);try{await refreshAfterAction(await postAction({action:'request_supplement',documents,reason}),'補件要求已送出。');}catch(e){alert(e.message||'送出補件要求失敗。');}finally{setLoading(false);}}
async function saveReviewNote(){const reason=String(document.getElementById('internalReviewNote')?.value||'').trim();setLoading(true);try{await refreshAfterAction(await postAction({action:'save_review_note',reason}),'審核備註已儲存。');}catch(e){alert(e.message||'儲存備註失敗。');}finally{setLoading(false);}}
async function performOverallAction(action){const reason=String(document.getElementById('overallReason')?.value||'').trim();if(action==='reject'&&!reason){showDetailTab('history');document.getElementById('overallReason')?.focus();return alert('拒絕申請時必須填寫原因，請在「紀錄與決定」填寫。');}if(action==='approve'&&selectedApplication?.profilePhotoRequired===true&&selectedApplication?.profilePhotoReview?.reviewStatus!=='approved')return alert('小U大頭照尚未人工審核通過，不能正式通過。');if(!confirm(action==='approve'?'確定通過此小U申請，並建立正式資料進入數位入職？':action==='reject'?'確定拒絕此小U申請？':'確定重新開啟此申請？'))return;setLoading(true);try{await refreshAfterAction(await postAction({action,reason}),'審核狀態已更新。');}catch(e){alert(e.message||'審核動作失敗。');}finally{setLoading(false);}}
async function initialize(){operatorInput.value=operatorName;if(!adminKey){loginOverlay.classList.remove('hidden');return;}try{loginOverlay.classList.add('hidden');operatorPill.textContent=`審核人員：${operatorName||'未命名'}`;await loadApplications();const riderId=new URLSearchParams(location.search).get('riderId');if(riderId)await openApplication(riderId);}catch(e){logoutAdmin();showLoginMessage('管理登入已失效，請重新輸入密碼。');}}
initialize();
</script>
</body></html>
