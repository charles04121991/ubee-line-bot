<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>UBee 小U福利管理</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
  --yellow:#facc15;--green:#16a34a;--red:#dc2626;--blue:#2563eb;
  --shadow:0 14px 34px rgba(15,23,42,.08);--radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.shell{max-width:1180px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:46px;height:46px;border-radius:15px;background:var(--yellow);display:grid;place-items:center;font-size:25px;box-shadow:0 8px 22px rgba(250,204,21,.25)}
.brand h1{font-size:22px;margin:0;font-weight:900}
.brand p{font-size:13px;color:var(--muted);margin:3px 0 0}
.btn{border:0;border-radius:14px;min-height:46px;padding:11px 16px;font-weight:800;background:#fff;color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
.btn.primary{background:var(--yellow);box-shadow:none}
.btn.blue{background:var(--blue);color:#fff;box-shadow:none}
.btn.green{background:var(--green);color:#fff;box-shadow:none}
.btn.red{background:#fee2e2;color:#b91c1c;box-shadow:none}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-size:13px;font-weight:800;color:#374151}
.input,.select,.textarea{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;padding:13px 14px;outline:none;min-height:48px}
.textarea{min-height:104px;resize:vertical;line-height:1.55}
.input:focus,.select:focus,.textarea:focus{border-color:#f0b90b;box-shadow:0 0 0 3px rgba(250,204,21,.18)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.error{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fee2e2;color:#991b1b;font-weight:700;font-size:13px}
.success{margin-top:12px;padding:12px 14px;border-radius:14px;background:#dcfce7;color:#166534;font-weight:700;font-size:13px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 16px}
.toolbar-copy strong{font-size:18px}
.toolbar-copy span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.workspace{display:grid;grid-template-columns:minmax(320px,.88fr) minmax(430px,1.12fr);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-head strong{font-size:17px}
.panel-body{padding:16px}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff;display:grid;gap:10px}
.item.active-edit{border-color:#eab308;box-shadow:0 0 0 3px rgba(250,204,21,.14)}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.item-title{font-weight:900;font-size:17px}
.item-sub{font-size:13px;color:var(--muted);margin-top:3px}
.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;white-space:nowrap}
.status.active{background:#dcfce7;color:#166534}
.status.draft{background:#fef3c7;color:#92400e}
.status.inactive{background:#e5e7eb;color:#4b5563}
.item-offer{font-weight:800;color:#111827;line-height:1.45}
.item-actions{display:flex;flex-wrap:wrap;gap:8px}
.item-actions .btn{min-height:38px;padding:8px 11px;font-size:13px}
.empty{padding:30px 14px;text-align:center;color:var(--muted);line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.section-title{font-size:13px;font-weight:900;color:#4b5563;margin:18px 0 10px;padding-top:4px}
.editor-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.preview{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}
.preview-card{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}
.preview-cover{height:150px;background:linear-gradient(135deg,#fff7cc,#fef3c7);display:grid;place-items:center;position:relative;overflow:hidden}
.preview-cover img{width:100%;height:100%;object-fit:cover}
.preview-cover .initial{width:68px;height:68px;border-radius:22px;background:#111827;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}
.preview-body{padding:16px}
.preview-body small{color:var(--muted);font-weight:700}
.preview-body h3{font-size:20px;margin:5px 0 10px}
.preview-offer{font-size:18px;font-weight:900;color:#a16207;margin:8px 0}
.preview-address{font-size:13px;color:var(--muted);line-height:1.5}
.file-box{border:1px dashed #cbd5e1;border-radius:16px;padding:14px;background:#f8fafc}
.file-box input{width:100%}
.image-current{display:flex;align-items:center;gap:12px;margin-top:10px}
.image-current img{width:74px;height:58px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:860px){
  .workspace{grid-template-columns:1fr}
  .topbar{align-items:flex-start}
  .grid2,.grid3{grid-template-columns:1fr}
  .shell{padding-left:12px;padding-right:12px}
  .panel{border-radius:20px}
}
</style>
</head>
<body>
<div class="shell">
  <div id="appView">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">🐝</div>
        <div><h1>UBee 小U福利管理</h1><p>Rider Benefits Management V1.1</p></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-copy"><strong>合作福利</strong><span id="countText">正在讀取…</span></div>
      <button class="btn primary" type="button" onclick="newBenefit()">＋ 新增福利</button>
    </div>

    <div class="workspace">
      <section class="panel">
        <div class="panel-head"><strong>福利清單</strong><button class="btn ghost" type="button" onclick="loadBenefits(true)">重新整理</button></div>
        <div class="panel-body"><div id="benefitList" class="list"></div></div>
      </section>

      <section class="panel">
        <div class="panel-head"><strong id="editorTitle">新增福利</strong><span id="editorStatus" class="status draft">草稿</span></div>
        <div class="panel-body">
          <input id="benefitId" type="hidden">
          <input id="imageUrl" type="hidden">
          <input id="imageStoragePath" type="hidden">
          <input id="imageStorageBucket" type="hidden">

          <div class="grid2">
            <div class="field"><label>合作店家名稱 *</label><input id="name" class="input" maxlength="120" placeholder="例如：慢慢騎"></div>
            <div class="field"><label>福利分類 *</label><select id="category" class="select"></select></div>
          </div>
          <div class="grid2">
            <div class="field"><label>優惠標籤</label><input id="badge" class="input" maxlength="80" value="正式小U專屬"></div>
            <div class="field"><label>排序</label><input id="sortOrder" class="input" type="number" min="0" max="99999" value="100"></div>
          </div>
          <div class="field"><label>小U優惠內容 *</label><input id="offer" class="input" maxlength="160" placeholder="例如：小U專屬價 NT$800"></div>
          <div class="field"><label>合作福利簡介</label><textarea id="description" class="textarea" maxlength="600" placeholder="簡短說明這項福利"></textarea></div>

          <div class="section-title">價格（沒有固定價格可留 0）</div>
          <div class="grid3">
            <div class="field"><label>原價</label><input id="originalPrice" class="input" type="number" min="0" value="0"></div>
            <div class="field"><label>現折</label><input id="discountAmount" class="input" type="number" min="0" value="0"></div>
            <div class="field"><label>小U專屬價</label><input id="memberPrice" class="input" type="number" min="0" value="0"></div>
          </div>

          <div class="section-title">店家位置</div>
          <div class="grid2">
            <div class="field"><label>縣市</label><input id="city" class="input" maxlength="40" placeholder="台中市"></div>
            <div class="field"><label>行政區</label><input id="district" class="input" maxlength="40" placeholder="南屯區"></div>
          </div>
          <div class="field"><label>店家地址 *</label><input id="address" class="input" maxlength="220" placeholder="完整地址"></div>
          <div class="field"><label>地圖搜尋文字</label><input id="mapQuery" class="input" maxlength="260" placeholder="可留空，預設使用店家地址"><div class="hint">若 Google Maps 用地址找不到店家，可填「店名＋地址」。</div></div>

          <div class="section-title">使用規則</div>
          <div class="field"><label>優惠期限</label><input id="validity" class="input" maxlength="120" value="長期合作"></div>
          <div class="field"><label>使用方式</label><textarea id="usageSteps" class="textarea" placeholder="一行一個步驟"></textarea><div class="hint">最多 8 個步驟，一行一個。</div></div>
          <div class="field"><label>注意事項</label><textarea id="notice" class="textarea" maxlength="1000" placeholder="優惠限制、預約方式、部分商品除外等"></textarea></div>

          <div class="section-title">合作店家圖片</div>
          <div class="file-box">
            <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp">
            <div class="hint" style="margin-top:7px">支援 JPG、PNG、WEBP，單張最多 6 MB。新圖片會在儲存福利時上傳。</div>
            <div id="currentImageBox" class="image-current hidden">
              <img id="currentImage" alt="目前合作店家圖片">
              <button class="btn red" type="button" onclick="removeCurrentImage()">移除圖片</button>
            </div>
          </div>

          <div class="section-title">發布狀態</div>
          <div class="field">
            <select id="status" class="select">
              <option value="draft">草稿｜小U看不到</option>
              <option value="active">上架｜小U立即可看到</option>
              <option value="inactive">下架｜保留資料但小U看不到</option>
            </select>
          </div>

          <div class="editor-actions">
            <button id="saveBtn" class="btn primary" type="button" onclick="saveBenefit()">儲存福利</button>
            <button class="btn" type="button" onclick="renderPreview()">更新預覽</button>
            <button id="deleteBtn" class="btn red hidden" type="button" onclick="deleteCurrentBenefit()">永久刪除</button>
          </div>
          <div id="editorMessage"></div>

          <div class="preview">
            <div class="section-title" style="margin-top:0">騎士端預覽</div>
            <div id="previewCard" class="preview-card"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const API_BASE = location.origin.includes('onrender.com')
  ? location.origin
  : 'https://ubee-line-bot-2-zezw.onrender.com';
const DEFAULT_STEPS = [
  '前往合作店家',
  '告知店家為 UBee 小U',
  '開啟 UBee 騎士端',
  '出示目前騎士端的小U身分證明',
  '店家確認後即可享有優惠'
];
let benefits = [];
let categories = ['騎士裝備','保健','餐飲','車輛','生活服務'];
let currentBenefit = null;
let toastTimer = null;

const $ = id => document.getElementById(id);
function escapeHtml(value=''){
  return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function showToast(message){
  const el=$('toast'); el.textContent=message; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function setMessage(target,message,type='error'){
  const el=$(target);
  el.innerHTML=message?`<div class="${type==='success'?'success':'error'}">${escapeHtml(message)}</div>`:'';
}
async function api(path,options={}){
  const response=await fetch(`${API_BASE}${path}`,{
    cache:'no-store',
    ...options
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok || data.success===false){
    const error=new Error(data.message||`HTTP ${response.status}`);
    error.status=response.status; throw error;
  }
  return data;
}
function statusLabel(status){
  return status==='active'?'已上架':status==='inactive'?'已下架':'草稿';
}
function updateEditorStatus(){
  const status=$('status').value||'draft';
  const el=$('editorStatus');
  el.className=`status ${status}`;
  el.textContent=statusLabel(status);
}
function populateCategories(){
  $('category').innerHTML=categories.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
}
async function loadBenefits(showNotice=false){
  try{
    const data=await api('/api/admin/rider-benefits');
    benefits=data.benefits||[];
    categories=data.categories||categories;
    populateCategories();
    renderList();
    if(showNotice) showToast('福利清單已更新');
  }catch(error){
    showToast(error.message||'讀取失敗');
  }
}
function renderList(){
  $('countText').textContent=`共 ${benefits.length} 筆｜上架 ${benefits.filter(x=>x.status==='active').length} 筆`;
  const el=$('benefitList');
  if(!benefits.length){
    el.innerHTML='<div class="empty">目前沒有福利資料。<br>按「＋ 新增福利」建立第一筆。</div>';return;
  }
  el.innerHTML=benefits.map(item=>`
    <div class="item ${currentBenefit?.id===item.id?'active-edit':''}">
      <div class="item-top">
        <div><div class="item-title">${escapeHtml(item.name)}</div><div class="item-sub">${escapeHtml(item.category)} · 排序 ${Number(item.sortOrder||0)}</div></div>
        <span class="status ${escapeHtml(item.status)}">${statusLabel(item.status)}</span>
      </div>
      <div class="item-offer">${escapeHtml(item.offer)}</div>
      <div class="item-actions">
        <button class="btn" type="button" onclick="editBenefit('${escapeHtml(item.id)}')">編輯</button>
        ${item.status!=='active'?`<button class="btn green" type="button" onclick="quickStatus('${escapeHtml(item.id)}','active')">上架</button>`:''}
        ${item.status==='active'?`<button class="btn" type="button" onclick="quickStatus('${escapeHtml(item.id)}','inactive')">下架</button>`:''}
      </div>
    </div>`).join('');
}
function formValue(id){return $(id).value.trim()}
function numberValue(id){const n=Number($(id).value||0);return Number.isFinite(n)?Math.max(0,Math.round(n)):0}
function readForm(){
  return {
    benefitId:formValue('benefitId'),
    name:formValue('name'),
    category:formValue('category'),
    badge:formValue('badge')||'正式小U專屬',
    offer:formValue('offer'),
    description:formValue('description'),
    city:formValue('city'),
    district:formValue('district'),
    address:formValue('address'),
    mapQuery:formValue('mapQuery'),
    validity:formValue('validity')||'長期合作',
    notice:formValue('notice'),
    usageSteps:$('usageSteps').value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean).slice(0,8),
    originalPrice:numberValue('originalPrice'),
    discountAmount:numberValue('discountAmount'),
    memberPrice:numberValue('memberPrice'),
    imageUrl:formValue('imageUrl'),
    imageStoragePath:formValue('imageStoragePath'),
    imageStorageBucket:formValue('imageStorageBucket'),
    sortOrder:numberValue('sortOrder'),
    status:formValue('status')||'draft'
  };
}
function writeForm(item={}){
  $('benefitId').value=item.id||item.benefitId||'';
  $('name').value=item.name||'';
  $('category').value=categories.includes(item.category)?item.category:categories[0];
  $('badge').value=item.badge||'正式小U專屬';
  $('offer').value=item.offer||'';
  $('description').value=item.description||'';
  $('city').value=item.city||'台中市';
  $('district').value=item.district||'';
  $('address').value=item.address||'';
  $('mapQuery').value=item.mapQuery||'';
  $('validity').value=item.validity||'長期合作';
  $('notice').value=item.notice||'';
  $('usageSteps').value=(item.usageSteps?.length?item.usageSteps:DEFAULT_STEPS).join('\n');
  $('originalPrice').value=Number(item.originalPrice||0);
  $('discountAmount').value=Number(item.discountAmount||0);
  $('memberPrice').value=Number(item.memberPrice||0);
  $('imageUrl').value=item.imageUrl||'';
  $('imageStoragePath').value=item.imageStoragePath||'';
  $('imageStorageBucket').value=item.imageStorageBucket||'';
  $('sortOrder').value=Number(item.sortOrder??100);
  $('status').value=item.status||'draft';
  $('imageFile').value='';
  updateCurrentImage();
  updateEditorStatus();
  renderPreview();
}
function newBenefit(){
  currentBenefit=null;
  $('editorTitle').textContent='新增福利';
  $('deleteBtn').classList.add('hidden');
  setMessage('editorMessage','');
  writeForm({status:'draft',sortOrder:100,city:'台中市',badge:'正式小U專屬',validity:'長期合作',usageSteps:DEFAULT_STEPS});
  renderList();
  if(innerWidth<861) document.querySelectorAll('.panel')[1]?.scrollIntoView({behavior:'smooth',block:'start'});
}
function editBenefit(id){
  const item=benefits.find(x=>x.id===id);
  if(!item)return;
  currentBenefit=item;
  $('editorTitle').textContent=`編輯｜${item.name}`;
  $('deleteBtn').classList.remove('hidden');
  setMessage('editorMessage','');
  writeForm(item);
  renderList();
  if(innerWidth<861) document.querySelectorAll('.panel')[1]?.scrollIntoView({behavior:'smooth',block:'start'});
}
function updateCurrentImage(){
  const url=formValue('imageUrl');
  $('currentImageBox').classList.toggle('hidden',!url);
  if(url)$('currentImage').src=url;
  else $('currentImage').removeAttribute('src');
}
function removeCurrentImage(){
  $('imageUrl').value='';
  $('imageStoragePath').value='';
  $('imageStorageBucket').value='';
  $('imageFile').value='';
  updateCurrentImage();
  renderPreview();
}
function renderPreview(){
  const item=readForm();
  const imageFile=$('imageFile').files?.[0];
  const localImage=imageFile?URL.createObjectURL(imageFile):item.imageUrl;
  const initial=escapeHtml((item.name||'U').slice(0,1));
  $('previewCard').innerHTML=`
    <div class="preview-cover">${localImage?`<img src="${escapeHtml(localImage)}" alt="">`:`<div class="initial">${initial}</div>`}</div>
    <div class="preview-body">
      <small>${escapeHtml(item.category||'福利分類')} · UBee 合作店家</small>
      <h3>${escapeHtml(item.name||'合作店家名稱')}</h3>
      <div class="status ${escapeHtml(item.status)}">${statusLabel(item.status)}</div>
      <div class="preview-offer">${escapeHtml(item.offer||'小U優惠內容')}</div>
      <div class="preview-address">${escapeHtml(`${item.city}${item.district}`)}<br>${escapeHtml(item.address||'店家地址')}</div>
    </div>`;
}
async function uploadSelectedImage(benefitId=''){
  const file=$('imageFile').files?.[0];
  if(!file)return null;
  const form=new FormData();
  form.append('file',file);
  if(benefitId)form.append('benefitId',benefitId);
  const response=await fetch(`${API_BASE}/api/admin/rider-benefits/image`,{
    method:'POST',
    body:form
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok||data.success===false)throw new Error(data.message||'圖片上傳失敗。');
  return data;
}
async function saveBenefit(){
  const payload=readForm();
  if(!payload.name){setMessage('editorMessage','請輸入合作店家名稱。');return;}
  if(!payload.offer){setMessage('editorMessage','請輸入小U優惠內容。');return;}
  if(!payload.address){setMessage('editorMessage','請輸入合作店家地址。');return;}
  $('saveBtn').disabled=true;
  setMessage('editorMessage','');
  try{
    const uploaded=await uploadSelectedImage(payload.benefitId);
    if(uploaded){
      payload.benefitId=payload.benefitId||uploaded.benefitId;
      payload.imageUrl=uploaded.imageUrl;
      payload.imageStoragePath=uploaded.imageStoragePath;
      payload.imageStorageBucket=uploaded.imageStorageBucket;
    }
    const data=await api('/api/admin/rider-benefits',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    setMessage('editorMessage',data.message||'福利已儲存。','success');
    await loadBenefits(false);
    const savedId=data.benefit?.id;
    if(savedId)editBenefit(savedId);
    showToast(data.message||'福利已儲存');
  }catch(error){
    setMessage('editorMessage',error.message||'儲存失敗。');
  }finally{
    $('saveBtn').disabled=false;
  }
}
async function quickStatus(id,status){
  try{
    await api(`/api/admin/rider-benefits/${encodeURIComponent(id)}/status`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({status})
    });
    await loadBenefits(false);
    if(currentBenefit?.id===id)editBenefit(id);
    showToast(status==='active'?'福利已上架':'福利已下架');
  }catch(error){showToast(error.message||'狀態更新失敗');}
}
async function deleteCurrentBenefit(){
  const id=formValue('benefitId');
  const name=formValue('name');
  if(!id)return;
  if(!confirm(`確定要永久刪除「${name||id}」嗎？\n\n如果只是暫停合作，建議改成「下架」保留資料。`))return;
  try{
    await api(`/api/admin/rider-benefits/${encodeURIComponent(id)}`,{method:'DELETE'});
    await loadBenefits(false);
    newBenefit();
    showToast('福利已永久刪除');
  }catch(error){setMessage('editorMessage',error.message||'刪除失敗。');}
}

$('status').addEventListener('change',()=>{updateEditorStatus();renderPreview();});
['name','category','offer','city','district','address','originalPrice','discountAmount','memberPrice'].forEach(id=>{
  $(id).addEventListener('input',renderPreview);
  $(id).addEventListener('change',renderPreview);
});
$('imageFile').addEventListener('change',renderPreview);

(async function boot(){
  populateCategories();
  await loadBenefits(false);
  newBenefit();
})();
</script>
</body>
