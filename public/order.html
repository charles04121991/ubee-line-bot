<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>UBee 跑腿｜V4 客戶端</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--yellow:#facc15;--yellow2:#f4bd00;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f6f7;--card:#fff;--green:#12b981;--orange:#ff6a00;--red:#ef4444;--shadow:0 14px 40px rgba(17,24,39,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{width:100%;max-width:520px;min-height:100dvh;margin:auto;padding-bottom:calc(110px + env(safe-area-inset-bottom));background:var(--bg)}
.topbar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.icon-btn{width:42px;height:42px;border:0;border-radius:14px;background:#f3f4f6;font-size:24px;font-weight:900}.brand{text-align:center;font-size:26px;font-weight:1000;letter-spacing:-1px}.brand b{color:var(--yellow2)}
.page{display:none;padding:14px}.page.active{display:block}.hero{padding:18px;border-radius:0 0 28px 28px;background:linear-gradient(145deg,#fff9d9,#fff 58%);border-bottom:1px solid #f3e7a5}.hero-title{font-size:29px;font-weight:1000;line-height:1.2}.hero-sub{margin-top:8px;color:var(--muted);font-weight:750;line-height:1.6}
.service-card{margin-top:14px;padding:16px;border-radius:24px;background:#fff;box-shadow:var(--shadow);border:1px solid rgba(17,24,39,.06)}
.service-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.service-tab{border:0;background:transparent;padding:10px 3px;color:#555;font-size:14px;font-weight:900;white-space:nowrap;border-radius:12px}.service-tab.active{color:#111;background:#fff8d5}.service-tab.active:after{content:"";display:block;width:26px;height:4px;border-radius:99px;background:var(--yellow2);margin:7px auto 0}
.nearby{display:flex;gap:8px;align-items:center;margin:12px 0;color:#777;font-size:13px;font-weight:800}.dot-online{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(18,185,129,.12)}
.address-stack{position:relative;padding-left:28px}.address-stack:before{content:"";position:absolute;left:10px;top:26px;bottom:26px;border-left:2px dashed #d1d5db}.address-row{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;min-height:74px;padding:12px 13px;margin:8px 0;background:#f7f7f8;border-radius:18px;border:1px solid transparent}.address-row:before{content:"";position:absolute;left:-25px;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(18,185,129,.12)}.address-row.drop:before{background:var(--orange);box-shadow:0 0 0 6px rgba(255,106,0,.12)}.address-main{min-width:0}.address-title{font-size:18px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.address-meta{margin-top:4px;font-size:12px;color:var(--red);font-weight:850}.book-btn{border:0;background:transparent;color:#666;font-weight:850}
.primary{width:100%;min-height:58px;border:0;border-radius:20px;background:var(--yellow);color:#111;font-size:19px;font-weight:1000;box-shadow:0 10px 24px rgba(250,204,21,.25)}.primary:disabled{opacity:.45}.secondary{width:100%;min-height:52px;border:1px solid var(--line);border-radius:17px;background:#fff;font-weight:900}.section-title{font-size:26px;font-weight:1000;margin:8px 0 14px}.section-sub{color:var(--muted);font-weight:750;line-height:1.6;margin:-6px 0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 28px rgba(17,24,39,.05);margin-bottom:14px}.field{margin-bottom:13px}.field:last-child{margin-bottom:0}.label{display:block;font-size:13px;font-weight:950;color:#3f444c;margin:0 0 7px}.control{width:100%;min-height:50px;border:1px solid var(--line);border-radius:15px;background:#f9fafb;padding:12px 13px;outline:none;font-weight:800}.control:focus{border-color:var(--yellow2);box-shadow:0 0 0 4px rgba(250,204,21,.15)}textarea.control{min-height:112px;resize:vertical;line-height:1.6}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:850}.chip.active{background:#fff7c2;border-color:#e9c100}.radio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.radio-card{border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;font-weight:900;background:#fff}.radio-card.active{background:#fff7c2;border-color:#e9c100}
.map-wrap{height:45vh;min-height:330px;margin:-14px -14px 14px;position:relative;background:#e5e7eb}.map{width:100%;height:100%}.map-overlay{position:absolute;left:14px;right:14px;bottom:14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.95);box-shadow:var(--shadow);font-weight:900}.route-meta{margin-top:5px;color:var(--muted);font-size:13px}.summary-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.summary-row:last-child{border-bottom:0}.summary-row span{color:var(--muted);font-weight:800}.summary-row strong{text-align:right}.price-total{font-size:34px;font-weight:1000}.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55;color:#555}.status-hero{text-align:center;padding:36px 18px}.pulse{width:88px;height:88px;border-radius:50%;margin:0 auto 18px;background:var(--yellow);display:grid;place-items:center;font-size:38px;animation:pulse 1.7s infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,.35)}50%{box-shadow:0 0 0 22px rgba(250,204,21,0)}}.status-title{font-size:27px;font-weight:1000}.status-sub{color:var(--muted);font-weight:750;line-height:1.7;margin-top:8px}.bottom-actions{position:fixed;left:50%;bottom:0;z-index:40;width:min(520px,100%);transform:translateX(-50%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(17,24,39,.45)}.modal.show{display:flex;align-items:flex-end}.sheet{width:100%;max-width:520px;max-height:92dvh;margin:auto;background:#fff;border-radius:26px 26px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet-title{font-size:23px;font-weight:1000}.close{border:0;width:38px;height:38px;border-radius:50%;background:#f3f4f6;font-size:20px}.map-small{height:160px;border-radius:18px;overflow:hidden;background:#e5e7eb}.notice{padding:11px 13px;border-radius:14px;background:#fff8d5;color:#6b5400;font-size:13px;font-weight:800;line-height:1.55}.error{padding:11px 13px;border-radius:14px;background:#fee2e2;color:#991b1b;font-size:13px;font-weight:850}.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(17,24,39,.18);border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><button id="backBtn" class="icon-btn hidden" onclick="goBack()">‹</button><div class="brand"><b>U</b>Bee 跑腿</div><button class="icon-btn" onclick="location.href='/support.html'">⋯</button></header>

<section id="home" class="page active">
  <div class="hero"><div class="hero-title">需要幫忙，交給 UBee</div><div class="hero-sub">代送、代取、代買、排隊與各種生活任務，一次完成。</div></div>
  <div class="service-card">
    <div id="serviceTabs" class="service-tabs"></div>
    <div class="nearby"><span class="dot-online"></span><span id="nearbyText">正在確認附近小U...</span></div>
    <div class="address-stack">
      <button class="address-row" onclick="openAddress('pickup')"><div class="address-main"><div id="pickupTitle" class="address-title">從哪裡開始？</div><div id="pickupMeta" class="address-meta">請填寫地址與聯絡資訊</div></div><span class="book-btn">地址簿</span></button>
      <button id="dropoffRow" class="address-row drop" onclick="openAddress('dropoff')"><div class="address-main"><div id="dropoffTitle" class="address-title">送到哪裡？</div><div id="dropoffMeta" class="address-meta">請填寫地址與聯絡資訊</div></div><span class="book-btn">地址簿</span></button>
    </div>
    <button class="primary" onclick="enterTaskStep()">立即下單</button>
  </div>
</section>

<section id="task" class="page"><div class="section-title" id="taskHeading">任務內容</div><div class="section-sub" id="taskSub"></div><div id="taskFields"></div></section>
<section id="route" class="page"><div class="map-wrap"><div id="routeMap" class="map"></div><div class="map-overlay"><div id="routeTitle">正在規劃路線...</div><div id="routeMeta" class="route-meta">請稍候</div></div></div><div id="routeSettings"></div></section>
<section id="payment" class="page"><div class="section-title">費用與付款</div><div class="section-sub">費用由 UBee 後端正式估價，送出前不會使用猜測金額。</div><div id="priceCard" class="card"><div class="spinner"></div> 正在取得正式估價...</div><div class="card"><div class="label">付款方式</div><div class="radio-grid"><button class="radio-card active">現金</button><button class="radio-card" disabled>LINE Pay<br><small>即將推出</small></button><button class="radio-card" disabled>信用卡<br><small>即將推出</small></button></div></div></section>
<section id="review" class="page"><div class="section-title">確認訂單</div><div class="section-sub">請最後確認地址、任務、配送與費用。</div><div id="reviewBox"></div><div class="card"><label class="agree"><input id="agree" type="checkbox">我已確認資料正確，並同意 UBee 跑腿服務規則與實際執行狀況可能產生的合理費用。</label></div></section>
<section id="status" class="page"><div class="status-hero"><div class="pulse">🐝</div><div id="statusTitle" class="status-title">正在尋找附近小U</div><div id="statusSub" class="status-sub">訂單已建立，系統正在媒合可接單的小U。</div></div><div id="statusCard" class="card"></div><button class="secondary" onclick="cancelOrder()">取消訂單</button></section>

<div id="bottomActions" class="bottom-actions hidden"><button id="nextBtn" class="primary" onclick="nextStep()">下一步</button></div>
</div>

<div id="addressModal" class="modal"><div class="sheet"><div class="sheet-head"><div id="addressSheetTitle" class="sheet-title">地址資訊</div><button class="close" onclick="closeAddress()">×</button></div><div class="field"><label class="label">地址</label><input id="addrInput" class="control" placeholder="輸入完整地址"></div><div class="grid2"><div class="field"><label class="label">門牌／樓層／室</label><input id="addrNote" class="control" placeholder="例如 3樓 810室"></div><div class="field"><label class="label">姓名</label><input id="addrName" class="control" placeholder="聯絡人姓名"></div></div><div class="field"><label class="label">電話</label><input id="addrPhone" class="control" inputmode="tel" placeholder="09xxxxxxxx"></div><div id="addressMap" class="map-small"></div><div style="height:12px"></div><button class="primary" onclick="saveAddress()">確定</button></div></div>

<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const SERVICES={send:{label:'幫我送',pickup:'寄件地址',dropoff:'收件地址',taskSub:'告訴小U要送什麼，以及物品大小與交付需求。'},pickup:{label:'幫我取',pickup:'取件地址',dropoff:'送達地址',taskSub:'填寫取件內容、取件碼與是否需要現場付款。'},buy:{label:'幫我買',pickup:'購買地點',dropoff:'送達地址',taskSub:'寫下要買的商品、規格、數量與預算。'},queue:{label:'幫排隊',pickup:'排隊地點',dropoff:'完成後送達地點',taskSub:'說明排隊目的、時間與完成後如何交付。'},general:{label:'全能跑腿',pickup:'任務地點',dropoff:'完成地點',taskSub:'描述你需要小U協助完成的任務。'}};
let state={service:'send',page:'home',addressTarget:'pickup',userId:'',config:{},mapsReady:false,pickup:{address:'',note:'',name:'',phone:'',lat:null,lng:null,placeId:''},dropoff:{address:'',note:'',name:'',phone:'',lat:null,lng:null,placeId:''},task:{},timing:'immediate',scheduledAt:'',speed:'standard',vehicle:'any',preferences:[],quote:null,orderId:'',order:null};
let routeMap,routeRenderer,addressMap,addressMarker,autocomplete;
function renderTabs(){ $('serviceTabs').innerHTML=Object.entries(SERVICES).map(([k,v])=>`<button class="service-tab ${state.service===k?'active':''}" onclick="selectService('${k}')">${v.label}</button>`).join(''); updateAddressLabels(); }
function selectService(k){state.service=k;renderTabs();}
function updateAddressLabels(){const s=SERVICES[state.service];$('pickupTitle').textContent=state.pickup.address||s.pickup;$('dropoffTitle').textContent=state.dropoff.address||s.dropoff;$('pickupMeta').textContent=state.pickup.name?`${state.pickup.name}・${state.pickup.phone}`:'請填寫地址與聯絡資訊';$('dropoffMeta').textContent=state.dropoff.name?`${state.dropoff.name}・${state.dropoff.phone}`:'請填寫地址與聯絡資訊';$('dropoffRow').classList.toggle('hidden',state.service==='queue'&&!state.dropoff.address);}
function openAddress(target){state.addressTarget=target;const a=state[target];$('addressSheetTitle').textContent=SERVICES[state.service][target];$('addrInput').value=a.address;$('addrNote').value=a.note;$('addrName').value=a.name;$('addrPhone').value=a.phone;$('addressModal').classList.add('show');setTimeout(initAddressMap,100)}
function closeAddress(){$('addressModal').classList.remove('show')}
function saveAddress(){const phone=$('addrPhone').value.replace(/\D/g,'');if(!$('addrInput').value.trim())return alert('請輸入地址');if(!$('addrName').value.trim())return alert('請輸入聯絡人姓名');if(!/^09\d{8}$/.test(phone))return alert('請輸入正確的台灣手機號碼');const a=state[state.addressTarget];a.address=$('addrInput').value.trim();a.note=$('addrNote').value.trim();a.name=$('addrName').value.trim();a.phone=phone;if(addressMarker){const p=addressMarker.getPosition();a.lat=p.lat();a.lng=p.lng()}closeAddress();updateAddressLabels()}
function enterTaskStep(){if(!state.pickup.address)return alert(`請先填寫${SERVICES[state.service].pickup}`);if(state.service!=='queue'&&!state.dropoff.address)return alert(`請先填寫${SERVICES[state.service].dropoff}`);renderTaskFields();showPage('task')}
function renderTaskFields(){const s=state.service;$('taskHeading').textContent=SERVICES[s].label;$('taskSub').textContent=SERVICES[s].taskSub;let h='';if(s==='send')h=`<div class="card"><div class="field"><label class="label">物品名稱</label><input id="itemName" class="control" placeholder="例如：文件、蛋糕、花束"></div><div class="grid2"><div class="field"><label class="label">數量</label><input id="quantity" class="control" placeholder="例如 1件"></div><div class="field"><label class="label">重量</label><input id="weight" class="control" placeholder="例如 2公斤"></div></div><div class="field"><label class="label">物品大小</label><select id="itemSize" class="control"><option value="small">小型｜機車可放</option><option value="medium">中型｜需較大空間</option><option value="large">大型｜建議汽車</option></select></div><div class="field"><label class="label">備註</label><textarea id="note" class="control" placeholder="易碎、保冷、交付方式等"></textarea></div></div>`;
if(s==='pickup')h=`<div class="card"><div class="field"><label class="label">取件內容</label><input id="itemName" class="control" placeholder="例如：包裹、文件、餐點"></div><div class="grid2"><div class="field"><label class="label">取件碼</label><input id="pickupCode" class="control"></div><div class="field"><label class="label">訂單編號</label><input id="orderNo" class="control"></div></div><div class="field"><label class="label">取件時是否付款</label><select id="pickupPaid" class="control"><option value="unknown">不確定</option><option value="paid">已付款</option><option value="unpaid">需要小U代墊</option></select></div><div class="field"><label class="label">備註</label><textarea id="note" class="control"></textarea></div></div>`;
if(s==='buy')h=`<div class="card"><div class="field"><label class="label">想買什麼</label><textarea id="note" class="control" placeholder="例如：炸雞 1份、無糖紅茶 2杯"></textarea></div><div class="grid2"><div class="field"><label class="label">預算上限</label><input id="budget" class="control" inputmode="numeric" placeholder="NT$"></div><div class="field"><label class="label">缺貨處理</label><select id="replacement" class="control"><option value="contact">聯絡我</option><option value="skip">缺貨就不買</option><option value="similar">可買相似品</option></select></div></div><div class="field"><label class="label">發票需求</label><select id="invoice" class="control"><option value="need">需要發票</option><option value="no_need">不需要</option><option value="either">皆可</option></select></div></div>`;
if(s==='queue')h=`<div class="card"><div class="field"><label class="label">排隊目的</label><input id="queuePurpose" class="control" placeholder="例如：代買限量商品、掛號"></div><div class="grid2"><div class="field"><label class="label">預估排隊時間（分鐘）</label><input id="queueMinutes" class="control" type="number" min="10" value="30"></div><div class="field"><label class="label">開始時間</label><input id="queueStart" class="control" type="datetime-local"></div></div><div class="field"><label class="label">輪到後如何處理</label><textarea id="queueHandoff" class="control" placeholder="例如：聯絡我確認、代購後送到指定地點"></textarea></div></div>`;
if(s==='general')h=`<div class="card"><div class="field"><label class="label">任務說明</label><textarea id="note" class="control" placeholder="請清楚說明小U需要做什麼"></textarea></div><div class="grid2"><div class="field"><label class="label">預估代墊金額</label><input id="budget" class="control" inputmode="numeric" placeholder="沒有則留白"></div><div class="field"><label class="label">完成期限</label><input id="deadline" class="control" type="datetime-local"></div></div></div>`;
$('taskFields').innerHTML=h;restoreTask();}
function restoreTask(){Object.entries(state.task).forEach(([k,v])=>{const e=$(k);if(e)e.value=v})}
function collectTask(){['itemName','quantity','weight','itemSize','note','pickupCode','orderNo','pickupPaid','budget','replacement','invoice','queuePurpose','queueMinutes','queueStart','queueHandoff','deadline'].forEach(k=>{const e=$(k);if(e)state.task[k]=e.value})}
function renderRouteSettings(){$('routeSettings').innerHTML=`<div class="card"><div class="field"><label class="label">配送時間</label><div class="radio-grid"><button class="radio-card ${state.timing==='immediate'?'active':''}" onclick="setTiming('immediate')">立即配送</button><button class="radio-card ${state.timing==='scheduled'?'active':''}" onclick="setTiming('scheduled')">指定時間</button><button class="radio-card" onclick="alert('多點配送將於後續版本開放')">多點</button></div></div><div id="scheduleField" class="field ${state.timing==='scheduled'?'':'hidden'}"><label class="label">指定時間</label><input id="scheduledAt" class="control" type="datetime-local" value="${esc(state.scheduledAt)}" onchange="state.scheduledAt=this.value"></div><div class="field"><label class="label">交通工具偏好</label><div class="radio-grid">${[['any','不限'],['motorcycle','機車'],['car','汽車']].map(([v,l])=>`<button class="radio-card ${state.vehicle===v?'active':''}" onclick="setVehicle('${v}')">${l}</button>`).join('')}</div></div><div class="field"><label class="label">配送要求</label><div class="chips">${[['call_before_arrival','抵達前聯絡'],['no_doorbell','不要按門鈴'],['leave_reception','可放櫃台'],['keep_warm','注意保溫'],['keep_dry','避免淋雨']].map(([v,l])=>`<button class="chip ${state.preferences.includes(v)?'active':''}" onclick="togglePref('${v}')">${l}</button>`).join('')}</div></div></div>`}
function setTiming(v){state.timing=v;renderRouteSettings()}function setVehicle(v){state.vehicle=v;renderRouteSettings()}function togglePref(v){state.preferences=state.preferences.includes(v)?state.preferences.filter(x=>x!==v):[...state.preferences,v];renderRouteSettings()}
function showPage(id){state.page=id;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));$('backBtn').classList.toggle('hidden',id==='home'||id==='status');$('bottomActions').classList.toggle('hidden',id==='home'||id==='status');$('nextBtn').textContent=id==='review'?'確認送出訂單':id==='payment'?'確認付款與費用':'下一步';window.scrollTo(0,0)}
function goBack(){const order=['home','task','route','payment','review'];const i=order.indexOf(state.page);showPage(order[Math.max(0,i-1)])}
async function nextStep(){if(state.page==='task'){collectTask();if(!validateTask())return;showPage('route');renderRouteSettings();await initRouteMap();return}if(state.page==='route'){if(state.timing==='scheduled'&&!state.scheduledAt)return alert('請選擇指定時間');showPage('payment');await loadQuote();return}if(state.page==='payment'){if(!state.quote)return alert('目前尚未取得正式估價');renderReview();showPage('review');return}if(state.page==='review'){await createOrder()}}
function validateTask(){const s=state.service,t=state.task;if(s==='send'&&!t.itemName)return alert('請填寫物品名稱'),false;if(s==='pickup'&&!t.itemName)return alert('請填寫取件內容'),false;if(s==='buy'&&!t.note)return alert('請填寫想買的商品'),false;if(s==='queue'&&!t.queuePurpose)return alert('請填寫排隊目的'),false;if(s==='general'&&!t.note)return alert('請填寫任務說明'),false;return true}
function serviceApi(){return {send:{group:'幫我送',key:'send',mode:'normal'},pickup:{group:'幫我取',key:'pickup',mode:'normal'},buy:{group:'幫代買',key:'buy',mode:'normal'},queue:{group:'幫排隊',key:'queue',mode:'queue'},general:{group:'全能跑腿',key:'general',mode:'normal'}}[state.service]}
function getPayload(){const a=serviceApi(),t=state.task;const note=t.note||t.queueHandoff||t.itemName||SERVICES[state.service].label;const budget=Math.max(0,Math.round(Number(t.budget||0)));return {userId:state.userId,customerId:state.userId,serviceGroup:a.group,serviceKey:a.key,serviceType:SERVICES[state.service].label,serviceCategory:SERVICES[state.service].label,serviceMode:a.mode,queueMinutes:Math.max(0,Math.round(Number(t.queueMinutes||0))),pickup:state.pickup.address,pickupAddress:state.pickup.address,pickupAddressNote:state.pickup.note,pickupContact:state.pickup.name,pickupPhone:state.pickup.phone,pickupLat:state.pickup.lat,pickupLng:state.pickup.lng,pickupPlaceId:state.pickup.placeId,dropoff:state.dropoff.address||state.pickup.address,dropoffAddress:state.dropoff.address||state.pickup.address,dropoffAddressNote:state.dropoff.note,dropoffContact:state.dropoff.name||state.pickup.name,dropoffPhone:state.dropoff.phone||state.pickup.phone,dropoffLat:state.dropoff.lat||state.pickup.lat,dropoffLng:state.dropoff.lng||state.pickup.lng,dropoffPlaceId:state.dropoff.placeId,item:note,note,itemQuantity:t.quantity||'',itemSize:t.itemSize||'small',itemSizeLabel:{small:'小型',medium:'中型',large:'大型'}[t.itemSize||'small'],taskDetails:{itemName:t.itemName||'',quantity:t.quantity||'',weight:t.weight||'',pickupCode:[t.pickupCode,t.orderNo].filter(Boolean).join(' / '),pickupPaid:t.pickupPaid||'unknown',replacementPolicy:t.replacement||'contact',invoice:t.invoice||'need',queuePurpose:t.queuePurpose||'',queueHandoff:t.queueHandoff||'',deadline:t.deadline||t.queueStart||''},deliveryPreferences:state.preferences,vehiclePreference:state.vehicle,orderTimingType:state.timing,scheduledAt:state.scheduledAt||'',speedType:state.speed,speed:state.speed,advancePayment:budget,estimatedGoodsAmount:budget,riderAdvanceAmount:budget,purchaseAdvanceAllowed:budget>0,purchasePaymentRule:budget>0?'rider_advance_then_customer_pay':'no_advance',paymentMethod:'unselected',paymentStatus:'unselected',isCashOrder:false,upstairsOption:'none',upstairsLabel:'無上樓需求',upstairsFee:0,fareMode:'base_km_minute',quoteId:state.quote?.quoteId||'',quotedAtMs:Number(state.quote?.quotedAtMs||0),quoteExpiresAtMs:Number(state.quote?.expiresAtMs||0),clientSchemaVersion:'ubee-customer-v4',addressCenterVersion:'v4',clientSubmittedAtMs:Date.now(),clientTimeZone:Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Taipei'} }
async function loadQuote(){const p=getPayload(),q=new URLSearchParams({from:p.pickupAddress,to:p.dropoffAddress,pickup:p.pickupAddress,dropoff:p.dropoffAddress,speedType:p.speedType,speed:p.speedType,serviceMode:p.serviceMode,serviceType:p.serviceType,serviceKey:p.serviceKey,queueMinutes:String(p.queueMinutes),upstairsFee:'0',itemSize:p.itemSize,advancePayment:String(p.advancePayment)});if(p.pickupLat!=null){q.set('pickupLat',p.pickupLat);q.set('pickupLng',p.pickupLng)}if(p.dropoffLat!=null){q.set('dropoffLat',p.dropoffLat);q.set('dropoffLng',p.dropoffLng)}$('priceCard').innerHTML='<div class="spinner"></div> 正在取得正式估價...';try{const r=await fetch('/api/quote?'+q.toString(),{cache:'no-store'}),d=await r.json();if(!r.ok||d.success===false)throw new Error(d.error||d.message||'估價失敗');state.quote=d;const total=Math.round(Number(d.customerPayableTotal??d.payableTotal??d.total??0));$('priceCard').innerHTML=`<div class="summary-row"><span>配送服務費</span><strong>NT$${Math.round(Number(d.serviceSubtotal??d.deliveryFee??0))}</strong></div>${p.advancePayment>0?`<div class="summary-row"><span>預估代墊</span><strong>NT$${p.advancePayment}</strong></div>`:''}<div class="summary-row"><span>路線</span><strong>${esc(d.distanceText||'系統估算')}・${esc(d.durationText||'')}</strong></div><div class="summary-row"><span>預估應付</span><strong class="price-total">NT$${total}</strong></div><div class="notice">正式報價由後端鎖定；現場若產生額外等待或實際代墊，依平台規則結算。</div>`}catch(e){state.quote=null;$('priceCard').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderReview(){const p=getPayload(),total=Math.round(Number(state.quote?.customerPayableTotal??state.quote?.payableTotal??state.quote?.total??0));$('reviewBox').innerHTML=`<div class="card"><div class="summary-row"><span>服務</span><strong>${SERVICES[state.service].label}</strong></div><div class="summary-row"><span>${SERVICES[state.service].pickup}</span><strong>${esc(p.pickupAddress)}</strong></div><div class="summary-row"><span>${SERVICES[state.service].dropoff}</span><strong>${esc(p.dropoffAddress)}</strong></div><div class="summary-row"><span>任務內容</span><strong>${esc(p.note)}</strong></div><div class="summary-row"><span>配送時間</span><strong>${state.timing==='immediate'?'立即配送':esc(state.scheduledAt)}</strong></div><div class="summary-row"><span>交通工具</span><strong>${{any:'不限',motorcycle:'機車',car:'汽車'}[state.vehicle]}</strong></div></div><div class="card"><div class="summary-row"><span>付款方式</span><strong>現金</strong></div><div class="summary-row"><span>預估應付</span><strong class="price-total">NT$${total}</strong></div></div>`}
async function createOrder(){if(!$('agree').checked)return alert('請先勾選確認資料正確');if(!state.quote?.quoteId)return alert('正式報價已失效，請返回重新估價');const b=$('nextBtn'),old=b.textContent;b.disabled=true;b.innerHTML='<span class="spinner"></span> 建立訂單中';try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(getPayload())}),d=await r.json();if(!r.ok||d.success===false)throw new Error(d.error||d.message||'建立訂單失敗');state.orderId=d.orderId||d.id||d.order?.id;state.order=d.order||d;await setCashPayment();showPage('status');renderStatus();startStatusPolling()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent=old}}
async function setCashPayment(){if(!state.orderId)return;const r=await fetch(`/api/orders/${encodeURIComponent(state.orderId)}/payment-method`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentMethod:'cash',method:'cash'})});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.error||d.message||'現金付款設定失敗')}
function renderStatus(){const o=state.order||{};$('statusCard').innerHTML=`<div class="summary-row"><span>訂單編號</span><strong>${esc(state.orderId)}</strong></div><div class="summary-row"><span>服務</span><strong>${SERVICES[state.service].label}</strong></div><div class="summary-row"><span>預估費用</span><strong>NT$${Math.round(Number(o.customerPayableTotal??state.quote?.customerPayableTotal??state.quote?.total??0))}</strong></div>`}
function startStatusPolling(){clearInterval(window.__poll);window.__poll=setInterval(async()=>{if(!state.orderId)return;try{const r=await fetch(`/api/orders/${encodeURIComponent(state.orderId)}`,{cache:'no-store'}),d=await r.json();const o=d.order||d;if(!r.ok)return;state.order=o;const st=o.status;if(['accepted','rider_assigned','heading_to_pickup'].includes(st)){$('statusTitle').textContent='小U已接單';$('statusSub').textContent='小U正在前往任務起點，請留意電話與訊息。'}else if(['picked_up','delivering'].includes(st)){$('statusTitle').textContent='任務進行中';$('statusSub').textContent='小U已開始執行任務。'}else if(['completed','delivered'].includes(st)){$('statusTitle').textContent='任務已完成';$('statusSub').textContent='感謝使用 UBee 跑腿。';clearInterval(window.__poll)}else if(['cancelled','canceled'].includes(st)){$('statusTitle').textContent='訂單已取消';$('statusSub').textContent='此訂單已結束。';clearInterval(window.__poll)}}catch(e){}},5000)}
async function cancelOrder(){if(!state.orderId)return;if(!confirm('確定要取消訂單嗎？'))return;try{const r=await fetch(`/api/orders/${encodeURIComponent(state.orderId)}/cancel`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok||d.success===false)throw new Error(d.error||d.message||'取消失敗');$('statusTitle').textContent='訂單已取消';$('statusSub').textContent='此訂單已結束。';clearInterval(window.__poll)}catch(e){alert(e.message)}}
async function init(){renderTabs();try{const r=await fetch('/api/config',{cache:'no-store'}),c=await r.json();state.config=c;await initLiff(c.liffId);if(c.googleMapsApiKey)await loadMaps(c.googleMapsApiKey);$('nearbyText').textContent='附近小U將依即時上線狀態媒合'}catch(e){console.warn(e);$('nearbyText').textContent='可正常下單，系統將自動媒合小U'}}
async function initLiff(id){if(!window.liff||!id)return;await liff.init({liffId:id});if(liff.isLoggedIn()){const p=await liff.getProfile();state.userId=p.userId||''}else{state.userId=localStorage.getItem('ubee_guest_id')||('guest_'+Date.now());localStorage.setItem('ubee_guest_id',state.userId)}}
function loadMaps(key){return new Promise((resolve,reject)=>{if(window.google?.maps){state.mapsReady=true;resolve();return}const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=places&language=zh-TW&region=TW&v=weekly`;s.async=true;s.onload=()=>{state.mapsReady=true;resolve()};s.onerror=reject;document.head.appendChild(s)})}
function initAddressMap(){if(!state.mapsReady)return;const center={lat:24.2521,lng:120.7214};addressMap=new google.maps.Map($('addressMap'),{center,zoom:15,mapTypeControl:false,streetViewControl:false,fullscreenControl:false});addressMarker=new google.maps.Marker({map:addressMap,position:center,draggable:true});if(!autocomplete){autocomplete=new google.maps.places.Autocomplete($('addrInput'),{componentRestrictions:{country:'tw'},fields:['formatted_address','geometry','place_id']});autocomplete.addListener('place_changed',()=>{const p=autocomplete.getPlace();if(!p.geometry)return;$('addrInput').value=p.formatted_address||$('addrInput').value;addressMap.setCenter(p.geometry.location);addressMarker.setPosition(p.geometry.location);state[state.addressTarget].placeId=p.place_id||''})}navigator.geolocation?.getCurrentPosition(pos=>{if(state[state.addressTarget].address)return;const c={lat:pos.coords.latitude,lng:pos.coords.longitude};addressMap.setCenter(c);addressMarker.setPosition(c)})}
async function initRouteMap(){if(!state.mapsReady){$('routeTitle').textContent='地圖暫時無法載入';$('routeMeta').textContent='仍可繼續下單，費用由後端路線估算';return}routeMap=new google.maps.Map($('routeMap'),{zoom:13,center:{lat:24.2521,lng:120.7214},mapTypeControl:false,streetViewControl:false,fullscreenControl:false});routeRenderer=new google.maps.DirectionsRenderer({map:routeMap,suppressMarkers:false});const ds=new google.maps.DirectionsService();ds.route({origin:state.pickup.address,destination:state.dropoff.address||state.pickup.address,travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{if(status==='OK'){routeRenderer.setDirections(res);const leg=res.routes[0].legs[0];$('routeTitle').textContent=`${leg.start_address} → ${leg.end_address}`;$('routeMeta').textContent=`${leg.distance.text}・約 ${leg.duration.text}`}else{$('routeTitle').textContent='路線由後端正式計算';$('routeMeta').textContent='請確認地址後繼續'}})}
renderTabs();init();
</script>
